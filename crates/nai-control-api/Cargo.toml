[package]
name = "nai-control-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.nai]
layer = "shared"

[dependencies]
nai-contracts.workspace = true
nai-kernel = { path = "../nai-kernel" }
nai-media-core = { path = "../nai-media-core" }
nai-storage = { path = "../nai-storage" }
serde_json.workspace = true
jsonschema.workspace = true
sha2.workspace = true
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
tempfile.workspace = true

[lints]
workspace = true
