[package]
name = "nai-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.nai]
layer = "runtime"

[dependencies]
nai-contracts.workspace = true
nai-kernel = { path = "../nai-kernel" }
nai-storage = { path = "../nai-storage" }
nai-media-core = { path = "../nai-media-core" }
nai-control-api = { path = "../nai-control-api" }
