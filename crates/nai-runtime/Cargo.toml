# The assembly root owns "is anyone on air right now?", so it is the layer that
# answers the upgrade core's activation gate (`ActiveSessionGate`). `shared` must
# not depend on `runtime`, but the reverse is allowed — see xtask/src/deps.rs.
nai-upgrade-core = { path = "../nai-upgrade-core" }
prost.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
