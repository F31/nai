[package]
name = "nai-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.nai]
layer = "tool"

[dependencies]
cargo_metadata.workspace = true
nai-kernel.workspace = true
prost.workspace = true
prost-build.workspace = true
prost-types.workspace = true
serde_json.workspace = true

# The golden-set evaluation runner (`examples/golden_eval.rs`) drives the real
# generation seam. Keeping those crates as dev-dependencies means the runner
# compiles only when the example is built: the tool's own library — which is
# what `cargo test -p nai-xtask --lib` and the portable profile cover — is
# unchanged.
[dev-dependencies]
nai-budget-core.workspace = true
nai-contracts.workspace = true
nai-provider-core.workspace = true
nai-security.workspace = true
serde_json.workspace = true
# 诊断产物扫描的夹具（W130）：与仓库域不同，产物域是对任意目录的遍历，
# 需要一个会自我清理的临时目录。
tempfile.workspace = true
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
