  - id: ACC-V561-HEAD-04
    group: HEAD
    stage: M1
    title: 侧脸、遮挡与超范围输入
    status: pending
    environment: windows-target
    command: 使用侧脸、手遮嘴、超出认证角度的素材
    expected: 拒绝口型或切静默展示，并记录原因；不贴错 ROI
    evidence: [recording, log, report]
  - id: ACC-V561-HEAD-05
    group: HEAD
    stage: M1
    title: Pro 档可选验证
    status: pending
    environment: windows-target
    command: 在目标机运行 FlashHead Pro 10 分钟
    expected: 仅当 >=15–20 FPS 且温度可控时开放；否则标为不可用/实验
    evidence: [metrics, recording, report]
  - id: ACC-V561-PIPE-01
    group: PIPE
    stage: M1
    title: 音频主时钟与音画同步
    status: pending
    environment: windows-target
    command: 播放 30 分钟含停顿和长句的语音
    expected: 按已播放样本选帧；AV 偏差 <=120ms；记录偏差样本
    evidence: [metrics, recording]
  - id: ACC-V561-PIPE-02
    group: PIPE
    stage: M1
    title: 帧率与掉帧
    status: pending
    environment: windows-target
    command: 1280×720@25fps 连续输出 30 分钟
    expected: 实际 FPS >=20；掉帧 <5%；记录迟到/丢弃原因
    evidence: [metrics, log]
  - id: ACC-V561-PIPE-03
    group: PIPE
    stage: M1
    title: 迟到帧与安全帧
    status: pending
    environment: simulated
    command: 注入 >200ms 帧延迟、worker 停顿和停止
    expected: 丢弃旧帧并显示安全帧；停止后旧帧不续播
    evidence: [log, screenshot, report]
  - id: ACC-V561-PIPE-04
    group: PIPE
    stage: M1
    title: 旧 epoch 拒绝
    status: pending
    environment: simulated
    command: 在停止/切段/接管后投递旧 epoch 帧与音频
    expected: 旧结果被拒绝；不显示、不播放、不计数为完成
    evidence: [log, report]
  - id: ACC-V561-LIVE-01
    group: LIVE
    stage: M1
    title: 30 分钟连续讲解
    status: pending
    environment: real-qwen
    command: 输入主题/资料并开始连续讲解 30 分钟
    expected: 段落衔接、暂停/继续/跳过、停止均可用；资料不足明确说明
    evidence: [recording, log, report]
    notes: ADR0204要求就绪后首声<=3000ms、实际句间gap目标<=300ms；四句有限验证不替代30分钟，已备文本不授LLM响应通过。
  - id: ACC-V561-LIVE-02
    group: LIVE
    stage: M1
    title: 问答与句边界归位
    status: pending
    environment: real-qwen
    command: 讲解中提出 5 个问题
    expected: 回答后回到讲解检查点；不重复已播段落；停止/接管可取消
    evidence: [recording, log]
