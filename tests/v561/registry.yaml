  - id: ACC-V561-LIVE-04
    group: LIVE
    stage: M2
    title: 预录动作片段
    status: pending
    environment: windows-target
    command: 触发挥手、点头、微笑等已授权片段
    expected: <=300ms 插播；播完回实时流；未知动作拒绝
    evidence: [recording, metrics, log]
  - id: ACC-V561-LIVE-05
    group: LIVE
