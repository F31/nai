acceptance:
  - id: ACC-V561-SETUP-01
    group: SETUP
    stage: M0
    title: 全新安装并进入待机
    status: pending
    environment: windows-target
    command: 双击安装包并按首次使用引导启动
    expected: 5 分钟内完成依赖检查并进入待机，不要求选择工作区或预算
    evidence: [screenshot, log, report]
  - id: ACC-V561-SETUP-02
    group: SETUP
    stage: M0
    title: 依赖缺失可执行修复
    status: pending
    environment: windows-target
    command: 分别停止 Qwen、移走 FlashHead 权重、关闭 OBS 后启动
    expected: 各自显示具体缺项与修复入口，不以单一技术错误码代替
    evidence: [screenshot, log]
  - id: ACC-V561-SETUP-03
    group: SETUP
    stage: M0
    title: 单数据根与路径逃逸拒绝
    status: pending
    environment: windows-target
    command: 使用默认数据根启动；再构造含 .. 的导入路径
    expected: 默认创建 config/nai.db/assets/logs/recordings；逃逸路径被拒绝并记录
    evidence: [log, report]
  - id: ACC-V561-SETUP-04
    group: SETUP
    stage: M3
    title: 卸载与重装
    status: pending
    environment: windows-target
    command: 卸载程序并选择保留数据根；重新安装后启动
    expected: 程序可卸载；保留的数据根可再次使用；不导入旧数据库
    evidence: [screenshot, log]
  - id: ACC-V561-TTS-01
    group: TTS
    stage: M0
    title: Qwen3-TTS 短句合成
    status: pending
    environment: real-qwen
    command: 使用已部署的 Qwen3-TTS 1.7B CustomVoice 合成中文短句并试听
    expected: 可播放；采样率/声道/模型版本被记录；不伪造音频
    evidence: [metrics, recording, log]
  - id: ACC-V561-TTS-02
    group: TTS
    stage: M1
    title: 长句、数字与型号
    status: pending
    environment: real-qwen
    command: 合成含长句、数字、型号和英文缩写的文本
    expected: 不吞字、不明显错读；实际文本/音频/耗时被记录
    evidence: [recording, metrics, report]
  - id: ACC-V561-TTS-03
    group: TTS
    stage: M1
    title: 取消、超时与旧音频阻断
    status: pending
    environment: real-qwen
    command: 播放中点击停止/静音，并让一次请求超时
    expected: 旧音频不续播；超时明确报告；服务端不可取消时记录为客户端丢弃
    evidence: [metrics, log, recording]
  - id: ACC-V561-TTS-04
    group: TTS
    stage: M1
    title: 缓存与预取
    status: pending
    environment: real-qwen
    command: 重复同一句并连续播放多句
    expected: 同键命中缓存；不同参数不复用；预取不串句、队列有界
    evidence: [metrics, log]
    notes: ADR0204个人体验首声3秒，机器预算见tests/v561/experience-budget.json；条件缓存与整句缓存分开取证，首PCM800ms仅优化目标，状态不因预算调整升级。
  - id: ACC-V561-HEAD-01
    group: HEAD
    stage: M0
    title: FlashHead Lite 10 分钟基线
    status: pending
    environment: windows-target
    command: 使用合法肖像与 Qwen 音频运行 FlashHead Lite 10 分钟
    expected: 无 OOM；记录 VRAM/RAM/温度/功耗/FPS/首帧/首音
    evidence: [metrics, recording, report]
  - id: ACC-V561-HEAD-02
    group: HEAD
    stage: M1
    title: 口型与身份保持
    status: pending
    environment: windows-target
    command: 连续说 30 分钟中文，覆盖数字、型号、停顿
    expected: 无明显双嘴/身份漂移；口型可辨；人工盲评记录
    evidence: [recording, review, report]
  - id: ACC-V561-HEAD-03
    group: HEAD
    stage: M1
    title: 长句、停顿与待机
    status: pending
    environment: windows-target
    command: 交替播放长句、静音和待机
    expected: 停顿不张嘴；待机稳定；停止后不显示旧嘴型
