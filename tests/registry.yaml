  - {id: "A01", title: "无独显演练闭环与降级视图", release_line: slice_0, automation: manual, status: implemented, evidence: "reports/2026-10-09-w06-avatar-2d-core.md", notes: "控制闭环与2D软件像素核心/RMS样本时轴已实测；帧槽位所有权与Linux tmpfs-file跨进程传输见reports/2026-10-09-w05-w06-frame-slots.md；帧句柄授权broker（内核FD证据）与keeper帧消费/待机切换见reports/2026-10-09-w05-w06-frame-handle-broker.md；nai-runtime装配根+监督+render-worker演练闭环（真实像素跨进程、强杀撤权standby）见reports/2026-10-09-w05-w06-composition-root.md；apps/engine可执行已实现（真实进程控制面+监督+媒体演练），见reports/2026-10-09-engine-assembly.md；引擎broker授权keeper单帧投递（真实子进程）见reports/2026-10-09-engine-broker-frame-delivery.md；Slice-0演练链路已延到「文本→语音→真实RGBA帧→双水位提交→播放完成」且帧只在内存,见reports/2026-10-10-engine-text-to-playback-ack.md；protected IPC/信号停机、设备接线、连接对端认证、真实TTS与Windows设备帧率未完成，不标tested"}
  - {id: "A02", title: "仅改配置换 Provider", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-10-w19-provider-substitution.md", notes: "第二家替换测试已建：同一调用函数（generate_once/speak_once）分别对 OpenAI兼容/Anthropic（文本）与 OpenAI兼容/ElevenLabs（语音），二者只差一个 ProviderProfile；线上差异（路径、凭据头名、请求体形状、voice 在体内/路径内）被实测到以防假通过；凭据形态与静态头由 Protocol 派生，能力不符显式报错；provider-core 36 项通过，见reports/2026-10-10-w19-provider-substitution.md。真实付费账号无余额、真实 TTS 设备未接，保持 implemented 不升级。W36 起第二家真实端点已按同一绑定接缝实测（见 reports/2026-10-10-w36-live-provider-evidence.md）：两家真实网关各只差一份 ProviderProfile，Protocol 枚举与适配器集合零改动。W37 修正了 W19 对照表中「请求体角色」一项：`messages[0].role` 的 system/user 之别**并非供应商差异，而是内部不一致**——真实网关证明 system-only 不被普遍合法（严格网关 400 No user query found in messages），已把 openai 适配器改为与 anthropic 一致的 `user` 轮；差异仍在（路径、stream_options、凭据头、用量字段名）但不含角色，见 reports/2026-10-10-w37-provider-message-turn.md、docs/adr/0039-provider-message-turn.md。"}
  - {id: "A03", title: "新增连接器不改内核", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-08-d13-platform-ingress.md", notes: "platform 准入已实现（D13：nai-kernel::platform::PlatformLink，判「一个事件能不能进」）。【落点（W53）】本项的命题「新增连接器不改内核」此前**没有主语**——plugins/ 下没有任何平台连接器，apps/ 下也没有 platform-bridge。W53 新建 plugins/platform-unavailable（层 plugin，包名 nai-platform-unavailable），登记快手与视频号两个**显式 Unavailable** 实例（§9.4 同目录、platform_id 互异），接缝在 nai-plugin-sdk::connector（层 sdk，只依赖 contracts；内核不得依赖插件，故接缝必须在内核之外）。A03 的**两个方向现在都由 xtask check-deps 强制**：既有分层规则已禁「内核依赖连接器」，W53 新增禁「**平台连接器依赖内核**」（路径 plugins/platform-* → kernel 层）——接缝充分则无需内核类型，故「加连接器不改内核」是**可判定的结构事实**而非承诺。『不放伪造 SDK』（§17.2）同为结构事实：该包只依赖 nai-contracts 与 nai-plugin-sdk，且 tests/unavailable.rs **读该包自身的 Cargo.toml** 做依赖白名单与 SDK 形态断言（含注入一个 vendor 依赖必须被抓到的自检）。不可用连接器的 §27.1 四项职责由接缝的闸门 `require_available()` 按名失败（CAPABILITY_NOT_READY + details[reason]=UNVERIFIED_EXTERNAL_DEPENDENCY），「返回 Ok 但什么都没做」在接缝里没有表示。**未升级**：真实官方接口、调试版伴侣 PoC 与平台准入决定（§9.3）仍是外部真值，两个平台一律如实记 Unavailable { NoOfficialInterface }，不宣称可上线，故保持 implemented。见 reports/2026-10-11-w53-explicit-unavailable-connector.md【W122 复核（维持 implemented）】本轮核实两条结构方向确已在门控内执行——deps::tests::a_platform_connector_never_depends_on_the_kernel 与 plugins/platform-unavailable/tests/unavailable.rs 均在 full 门控实跑通过；**但本项不升 tested**：其 notes 的既有裁定指明剩余缺口是外部真值（真实官方接口、调试版伴侣 PoC 与 §9.3 平台准入决定），本仓无从提供可核验证据，按 admission-registry「未完成或外部阻塞的目标 MUST 保留为 implemented」维持原状，不因结构守卫通过而升级。"}
