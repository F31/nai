  # H 系列：智能体 Harness 与开放互操作（V3.11 §40–§47、§48.5）
  - {id: "H01", title: "装配顺序与分段预算可判定：不可裁剪段缺失时拒绝调用；裁剪只从后段发生并记录原因", release_line: r1, automation: unit, status: pending, notes: "【本轮落点（W69）】判定机制已交付：crates/nai-kernel/src/evaluate/assembly.rs 的 evaluate_assembly——九段固定顺序（SEGMENT_ORDER 逐项照抄 §41.1）与未定义段名、不可裁段 1–3 缺失即拒并**按名列出**缺哪些、裁剪只允许从后段发生（被裁的可裁段须构成后缀，只判「有裁剪记录」不够）、裁剪须同时记录被裁项与原因、分段预算 token/char/items 三维且判**分段**、不可裁段须有 floor、片段来源标识与作用域齐备、§41.3「观众文本／检索片段／工具返回／外部智能体返回一律标为数据」；各项**互不短路**（缺段与乱序可同时报出），且**不复用** harness::FailureLayer 的降级计算——一次装配的合法性与其失败落点是两件事。crates/nai-kernel/tests/assembly.rs **36 项**覆盖（两条「构造出的拒绝集合恰为 ALL」总账、九段／七类来源／不可裁序号／四类一律为数据**逐项写死**、跨模块守卫「装配记录字段 == harness 的 L1 必需字段表」、七组非空洞注入各自被抓住）。**验收保持 pending**：§41.2 的分段预算初值须由 §47.2 黄金集回放实测确定并记入 ADR（§48.7 禁止采外部观察值），且装配器尚未接入 runtime、无端到端证据 ⇒ 判定面交付 ≠ 验收达标。**W106（本轮落点）**补上 H01 的 runtime 接线：crates/nai-runtime/src/assembly.rs 的 Composition::record_assembly 现在**接收 AssemblyPlan**，先跑 evaluate_assembly（判定规则本身由 W69 落地、本轮**一行未改**）再跑 rebuild_assembly，**两项判定都跑、都不短路**；结局扩为**四态**（Logged／NotCallable／NotRebuildable／Neither，拒绝侧带**两侧**拒绝名与缺段名），任一拒绝**一个字节都不落盘**；载荷补齐 §41.5 的**四项**（新增 segment_usage 与 crops，取值**照抄判定输入**、MUST NOT 由正文重算、MUST NOT 夹带 fragment 的 scope／age_ms／trust／source 与判定诊断清单）；新增 Composition::read_logged_assemblies **逐行**读回（不可解析 ⇒ 具名失败，W104 旧形状行缺两键 ⇒ 两项读作空列表）。故「§41.1 不可裁段缺失 ⇒ 拒绝调用」在 runtime 上**已有表达**；**验收仍 pending**——装配器的**真实产生者**（把九段片段喂给模型、§41.2 分段预算初值标定、§47.2 六类回归属 **H16**）未接线，且 rebuild_assembly_from_log 的片段池**跨行合并**（W104 语义、本轮只统一解析路径）比 §41.5 的「只靠链重建**这一次**装配」弱，已具名登记。**【W127 收紧：该弱化已闭合】** crates/nai-runtime/src/assembly.rs 的 rebuild_assembly_from_log **不再把多行合并成片段池**，而是把**每一行作为自己的条目**交给判定（一个条目就是一次装配——§41.5 的四项由写路径一起落进一条条目）；判定面新增 `entry_carries_assembly`（承载判据 = 片段标识**多重集**、含重复、**不计顺序**：按确切顺序选行会让既有的 `rebuild.order_differs` 失去覆盖）与 `rebuild_assembly_from_entries`（**存在一个**承载条目能重建即可重建；无任何条目承载 ⇒ 具名 `rebuild.not_in_one_entry`，`unlogged_ids` 对**整条链**重新派生，MUST NOT 把链上存在的标识误报成未落日志）；`RebuildRejection::ALL` 6 → **7**。写路径**不改**（其输入是「本次要落盘的素材」而非「链上一个条目」；改成条目判定会把 `fragment_not_logged` 换成更笼统的）。判据：kernel **36 → 40**、runtime **25 → 27**；**7** 组非空洞注入各自变红（I7 首跑**假绿**——原多重集断言其实被长度闸门挡下、一对一配对当时无覆盖，改成**等长不同重数**后同一注入变红，已如实登记）。**status 仍 `pending`**。见 docs/adr/0105-rebuild-in-one-entry.md、openspec/changes/archive/2026-10-16-w127-rebuild-in-one-entry/。**【W133 补上缺失的生产者，验收仍保持 pending】** 开工前现测：`grep -rn AssemblyPlan` 在 crates/ 与 apps/ 里排除测试后只有两处——`evaluate/assembly.rs` 的定义与 `runtime/src/assembly.rs` 的消费，**没有任何一行构造它** ⇒ `record_assembly` 的入参在生产代码里从未被生产过，仓库里每一份计划都诞生在测试里。W133 新建 `crates/nai-kernel/src/assemble.rs` 的 `plan_assembly`：把「按段分组的候选片段 + 调用方给定的逐段预算」装配成计划，只决定三件事——顺序（施加 §41.1 的固定序列，不回显输入顺序）、在场（没给候选的段**不出现**，绝不补空切片，否则 UncroppableSegmentMissing 在真实路径上没有对象可拒）、裁剪（段内从**尾部**裁并同时记录被裁项与原因；1–3 段任何预算都不裁，超预算交判定面拒）。**零业务常量**：九段与顺序来自 SEGMENT_ORDER、可裁性来自 Segment::uncroppable、每个上限来自调用方的 SegmentBudget——§41.2 的初值要由 §47.2 黄金集回放标定并记 ADR，在这里发明数字等于把 §41.2 答第二次。只拒一件事：§41.1 未定义的段名 ⇒ assemble.unknown_segment，不静默丢弃。判定面与执行体本轮**零改动**。判据：kernel 新测试目标 tests/assemble.rs **10/10**、runtime tests/assembly.rs **27 → 29**；九组非空洞注入全部真红（去排序 3 红 / 补空段 2 / 头部裁剪 1 / 裁不可裁段 1 / 占用报全量 1 / 静默跳过 1 / 代编预算 1 / 不记原因 1 / 按名字排序 4），三文件 sha256 逐字节还原。**status 仍 pending**——闭合的是「②执行体获得真实入参」，**不是验收达标**：④真实产生者（把装配结果喂给模型的调用点）与 §41.2 初值标定仍未接线。见 openspec/changes/archive/2026-10-17-w133-assembler/。装配不是调用式契约，故 contract 留空；automation 为规划意图（W56，V3.11 §41、§48.5）"}
  - {id: "H02", title: "装配可重建：由决策日志的片段引用重建同一上下文，不依赖当时内存", release_line: r1, automation: integration, status: pending, notes: "【本轮落点（W69）】判定机制已交付：rebuild_assembly 只消费决策日志（AssemblyRecord + LoggedFragment），按**日志自身顺序**排出被引用片段再与记录比较——按记录顺序排序后比较会让「日志顺序与记录不同」**恒真**，该坏实现已被注入验证抓住；FragmentNotLogged（引用的片段根本没进日志）与 FragmentContentNotInLog（有日志条目但正文没落盘、只存了指向当时内存的指针）**分开具名**，因为前者是「没记」、后者是「记了但记的是内存指针」，H02 要禁的正是后者；模型／提示词版本缺失各具其名；明文凭据复用 harness::CREDENTIAL_MARKERS（INV-11，不建第二张标记表）。**验收保持 pending**：日志真实落盘（nai-storage 的只追加哈希链）与运行时接线未建，本轮交付的是判定面 ⇒ 报告 MUST NOT 出现「已不依赖当时内存」这类运行期断言。**W104（本轮落点）**补上 runtime 接线：crates/nai-runtime/src/assembly.rs 的 Composition::record_assembly 在判定之后追加或具名拒绝（载荷按**记录进入顺序**含每片段的 id／来源标识／**字面正文**与模型、提示词版本，MUST NOT 退化成指向当时内存的指针），Composition::rebuild_assembly_from_log **只读真实链**、按**日志自身顺序**解出片段后**调用同一判定**，故「真的落链且能只靠链重建」已可测；**验收仍 pending**——装配器的**真实产生者**（把九段片段喂给模型、§41.2 分段预算初值标定、§47.2 六类回归属 **H16**）未接线。另：`assembly` 种类暴露了**存储 schema 里的第二个闭世界**——decision_log 的 kind CHECK 与 DecisionKind 枚举并存，新增迁移 0007 逐列重建该表（既有行逐字复制含四个哈希列、索引与两个只追加触发器重建），migration::VERSION 6→7、backup.schema.json 的 db_schema_version 同步 7；只改枚举不改 CHECK 时插入被 schema 拒绝并**静默落入遥测缓冲**（ack.persisted==false，不报错），W104 首跑即复现。**【W127：口径收紧为「一个条目就是一次装配」】** 验收口径是**本条目标题**里的「重建**同一**上下文」（§41.5 原文只说「装配 MUST 落决策日志」，**未**明文要求「单个条目」⇒ 依据链 MUST 写成 registry 标题，MUST NOT 说成「§41.5 要求单条目」）。W104 的 `rebuild_assembly_from_log` 把读回的多行**合并成一个池**再判 ⇒ 立项判据实测红：链上两行分别只承载 `frag-a`／`frag-b`、记录声明 `[frag-a, frag-b]` 时，旧实现报 `rebuildable = true` 且**零拒绝名**，而**没有任何一行**曾装配过这个上下文。W127 改为**逐行作为独立条目**：`entry_carries_assembly`（多重集、不计顺序）+ `rebuild_assembly_from_entries`（存在性 + 并集 + 整链派生 `unlogged_ids`）+ `RebuildRejection::NotInOneEntry`（`rebuild.not_in_one_entry`）。→ **合法用例零假阴性**：写路径的 `ordered_fragments` 按 `record.fragment_ids` 逐项写出，故**任何真的被记录过的记录**其自己的行必然承载它 ⇒ 逐条目与池化结论相同；收紧只消除**假阳性**。非空洞守卫按**面**取样（该变体是**链级**事实、写路径一次只交一个条目 ⇒ 走读回面），注释写明这一不对称是结论。**status 仍 `pending`**——闭合的是判定面口径，**不是**验收达标：真实产生者（把九段片段喂给模型、§41.2 分段预算初值标定、§47.2 六类回归属 **H16**）未接线。见 docs/adr/0105-rebuild-in-one-entry.md、docs/reports/2026-10-16-w127-rebuild-in-one-entry.md、openspec/changes/archive/2026-10-16-w127-rebuild-in-one-entry/。**【W133：链上第一次出现真实装配条目，验收仍保持 pending】** 与 H01 同轮、同一个生产者。W133 的 plan_assembly 让 record_assembly 第一次拿到生产代码造出的计划，故 rebuild_assembly_from_log 面对的链不再只有测试写进去的行。端到端判据（crates/nai-runtime/tests/assembly.rs 的 a_plan_from_the_assembler_reaches_the_chain_and_rebuilds_from_it）走完整条路径：候选 → 装配 → 落链 → 逐行读回 → 只靠链重建，并断言重建序列与 §41.1 的顺序一致；另一半 an_incomplete_plan_from_the_assembler_appends_nothing 钉「装配器造得出但 §41.1 仍拒的计划**一个字节都不落链**」。**status 仍 pending**——同上，④真实产生者未接线；§41.2 分段预算初值标定属 **H16**。见 openspec/changes/archive/2026-10-17-w133-assembler/。装配不是调用式契约，故 contract 留空；automation 为规划意图（W56，V3.11 §41.5）"}
  - {id: "H03", title: "记忆写入门槛：工具返回、评论原文、模型草稿不得写成事实或承诺", release_line: r1, contract: "memory.access@1", automation: unit, status: pending, evidence: "reports/2026-10-11-w57-memory-read-write-surface.md", notes: "【W57 落点：判定机制已交付，验收保持 pending】既有 crates/nai-kernel/src/evaluate/memory.rs 覆盖的是 V3.5 §23.5 的**子集**（working_memory 按 played_ids 过滤、session_summary 确定性去重、viewer_record_allowed 默认关闭），**没有「写入来源」这一维**——工具返回、外部智能体返回、评论原文与模型草稿与正常内容不可区分，§42.2 的来源门槛、必填项（作用域/来源标识/时间）与「叙述/权威事实」标注在仓库里零落点。W57 **只增不改**地补上：WriteSource（approved_played／approved_unplayed／tool_return／peer_return／comment_text／model_draft）、ClaimKind（叙述/权威事实）、MemoryCandidate 与 admit_write。判据每条对应一个具名拒绝：不可信来源一律不得写成事实或承诺（**不按 claim 放行**）⇒ untrusted_source_as_fact；已批准未播出 ⇒ unplayed_candidate_as_fact；缺作用域 ⇒ write_without_scope；缺来源标识 ⇒ write_without_source_ref；缺时间 ⇒ write_without_timestamp；权威事实缺 §6 发布引用 ⇒ fact_without_publish_ref；权威事实落在非语义记忆 ⇒ fact_outside_semantic_memory。测试 crates/nai-kernel/tests/memory.rs（**21 项**，新增第 **69** 个测试目标）含「拒绝名并集**恰为 23 条**」总账断言、以及正向不变量（合规候选零拒绝——否则「全都拒」也能让测试变绿）。**为何仍是 pending**：判据描述的是**运行时行为**，而真实记忆子系统不存在——无持久化、无控制面接线、无 Pro 跨会话（§42.5 本轮未覆盖）。沿用 A12（桌面壳边界）／O01（演示包判定机制）／O05（呈现层）与 W32–W36 判定骨架轮的先例：**机制交付 ≠ 验收达标**。见 docs/reports/2026-10-11-w57-memory-read-write-surface.md、docs/kernel.md、openspec/changes/archive/2026-10-11-w57-memory-read-write-surface/。【W89 订正：判定机制已补】「观众长期记忆默认关闭」这条开关原先只在**读取面**有执行体，写入面 admit_write 既不收策略也不检查它 ⇒ 默认关闭下一条 kind=\"viewer\" 的候选**会被接受**（实测改前返回 Ok(())）。W89 把它收成**唯一一处**判定 memory::viewer_memory_gate，读取面/写入面/请求准入面共用；写入面补上执行体，判据位置与读取面同序（结构必填 → 能力开关 → 授权/来源），拒因复用 viewer_memory_disabled（不新造，集合仍 23）。**验收仍保持 pending**——原因同前：判定面自足 ≠ 运行时接线，admit_write/read_records 在生产代码里无调用方。见 docs/reports/2026-10-13-w89-viewer-memory-single-answering-point.md、docs/adr/0067-viewer-memory-single-answering-point.md。【W107 接线：写入面已接上**真实存储**，验收仍保持 pending】W57 交付判定面、W89 补上开关的写侧，但 `admit_write` 在生产代码里**始终零调用方**，而 `memory_records`（`0001-foundation.sql:29`，九列与 MemoryRecord 契约九字段**逐字对应**）**零生产读写**——全仓仅两条命中且都在测试里、都是**目录级**断言（表在目录里 / 新库这张表为空）。⇒「一次被**拒绝**的记忆写入究竟有没有落库」在 runtime 上**不可表达**；与 W103/W104/W105/W106 **连续第五轮同型**（判定面存在、执行体不存在），**不同点**：前四轮执行体是只追加哈希链，本轮是**领域表**（§42.2 的拒因后果原文是「MUST NOT **落库**」；记忆**观测**落链已由 W103 的 record_observation 承担 ⇒ 此处再写一条决策日志条目就是**同一件事的第二处定义**，且要新增 DecisionKind 变体 ⇒ 一次迁移）。W107 在 `crates/nai-runtime/src/memory.rs` 新增 `Composition::write_memory(candidate, policy)`：**先**跑 admit_write（判定规则**一行未改**），放行 ⇒ `Written(record)` 并落 `memory_records`（`Store::record_memory`：id() 校验 + access() 查权限 + 写九列 + 主键冲突 ⇒ 具名 Conflict），拒绝 ⇒ `Refused(MemoryWriteRefusal)`（**判定自己的**拒绝名 + record_id）且**一列不落库**。**判定与落库是一处**（同 W103–W106）；结局**恰两态**（H03 只有一项判定 ⇒ 多一态是无对应事实的空壳；Err 留给故障——判定说「不」是结论不是故障）。**判定一次**：存储层不重跑 §42.2（一条门槛答两次会分家，W88）、不复写能力开关（唯一应答点仍是 viewer_memory_gate，ADR 0067）、也不加写入面的时效规则（§42.3 的时效在**读取**面；record_candidate 拒已过期候选而 record_memory 不拒，规则不同是刻意的）。**零迁移**：不新增 DecisionKind、不改 migrations/**、migration::VERSION 保持 **7**、不改 schemas/** 与生成物、**零新增依赖**、**权限面零改动**（复用既有权限名 `session.manage`——⚠️ 这是**选择**不是「本来如此」，按 memory.access@1 操作名对齐的 memory.write 也站得住，本轮刻意不扩张授权面）。测试 `crates/nai-runtime/tests/memory.rs`（**9** 项，新测试目标 ⇒ Rust 目标数 +1，由 cargo test --workspace 自动覆盖 ⇒ **无需** engineering_checks 登记），非空洞守卫 `refusal_sample` 对 MemoryRejection（23 变体）**穷尽 match**：写入面八条各给样本、其余显式 None（kernel 加变体而此处未决定归属 ⇒ **编译失败**），并断言可达的**恰为这八条**且全部**零落库**；**七**组非空洞注入共 **16 红**、每组 ≥1（I1 3 / I2 3 / I3 4 / I4 2 / I5 1 / I6 1 / I7 2），基准 sha256 逐字节还原。**status 仍 `pending`**——本轮闭合的是「判定面 → 执行体」，**不是验收达标**；控制面接线、§42.4 遗忘链的执行体、Pro 跨会话 §42.5 未建。**如实披露**：`source`/`claim`/`source_ref`/`written_at_utc_ms`/`publish_ref` **不落库**（表中无列，§42.2 把它们定为判定输入）⇒「这条记录当时是从哪种来源写进来的」在库里**查不到**。见 docs/reports/2026-10-14-w107-memory-write-gate-wiring.md、docs/adr/0085-memory-write-gate-wiring.md、openspec/changes/archive/2026-10-14-w107-memory-write-gate-wiring/。【W109 追加：§42.4 遗忘链的**阻断**落点已建】W107 把「§42.4 遗忘链的执行体」列为未建；W109 建了它的**前半**——`Composition::forget_memory` **先**写 `memory_records.revoked_at_ms`（`0008-memory-revocation.sql` 新增的可空列）阻断读取、**再**判这次遗忘的陈述是否如实；**清除副本一侧仍未建**（一条被遗忘的记录**仍在库里**，只是读不出来）。写入面本身本轮无改动。**status 仍 `pending`**。见 docs/reports/2026-10-15-w109-memory-read-surface.md、docs/adr/0087-memory-read-surface.md。【W110 接线：控制面已接上，验收仍保持 pending】W107/W109 分别把写入面与读取面接上了**真实存储**，但 `write_memory` / `read_memory` / `forget_memory` 三个入口在生产代码里**始终零调用方**（实测：在非测试的 `.rs` 里检索 `read_memory` / `forget_memory` / `write_memory` ⇒ **零命中**，只有测试在调）⇒ 链子最上面一环是空的。与 W103–W109 **连续第七轮同型**（判定面存在、执行体不存在），**不同的一点**：前几轮缺**执行体**，本轮执行体已存在、缺的是**调用方** ⇒ **纯接线轮**：**零迁移、零契约字段改动、零 schema 改动**（与 W109 必须付一次迁移形成对照）。**接缝位置由分层决定，不是偏好**：`xtask/src/deps.rs` 禁止 shared 依赖 runtime ⇒ `trait MemorySurface`（`read` / `forget`）**在 `nai-control-api` 定义**、由 `nai-runtime` 的 `MemoryAdapter{root, policy}` 实现、**app（engine）注入**；后端未注入 ⇒ `503 CAPABILITY_NOT_READY`，MUST NOT 以空结果假成功（与 `approvals` 同形）。⚠️ **签名刻意不带 `now_ms` 与 `MemoryPolicy`**：时间源只在一处（实现端 `utc_ms()`）；策略由**装配点**给定、适配器持有——让路由挑策略会让 §42.3 的 `viewer_memory_enabled` **答两次**（W89）。**两个端点**（控制面**一律禁 query**，有既有测试钉它 ⇒ 读取也走 `POST` + body，不是 `GET`）：`POST /api/v1/memory/read`（权限 `memory.read`）／`POST /api/v1/memory/forget`（权限 `memory.forget`，**单独成权** ⇒ 可只吊销记忆访问而不连带会话读取）。**三态 MUST 不丢维度**：`MemoryControlResult` = `Ok(T)` / `Rejected(MemoryRejection)` / `Fault(ErrorCode)`；判定拒绝 ⇒ **422** + **判定自己的**稳定名字，**MUST NOT** 折成 `200` 加空 `records`（否则「本次读取不成立」与「读出来零条」不可区分，后者是被**允许**的）；路径故障 ⇒ 按 `ErrorCode` 映射（装配根忙 ⇒ **409 冲突**），**MUST NOT** 把锁竞争记在判定名下；故障载体**复用**契约 `ErrorCode`，不新造分类。**作用域是控制面自己的绑定**，请求里的 `workspace_id` / `session_id` 一律忽略（否则隔离边界由被隔离者填）。**「没给输入」≠「空集」**：`kinds` 缺/`null` ⇒ 全部三类、显式 `[]` ⇒ 空集；`budget` 缺省 16／上限 256；`trigger` 缺 ⇒ `UserRequest`、`purge_state` 缺 ⇒ `NotStarted`、`claims_fully_erased` 缺 ⇒ `false`（缺省一律取**安全方向**）。测试 `crates/nai-control-api/src/tests.rs`（**26** 项，W110 新增 **11**）用**真实 loopback + reqwest** 钉后端缺失／无 token（401）／无权限（403）／入参各失败路径（读 5 条 + 遗忘 7 条）／`PurgeState::ALL` 与 `ForgetTrigger::ALL` 在册标签逐个**回环**／超长 body ⇒ 413；**接线成立由「调用真的发生了」证明**——`RecordingSurface` 记 `reads`/`forgets` 并留下路由构造出的**入参**（作用域/类别/配额），恒真桩会让「接线」变成装饰。`crates/nai-runtime/tests/memory.rs`（**23** 项，W110 新增 **5**）钉经接缝走一遍后越作用域判据**仍有对象**、阻断后重读 ⇒ `Revoked`、重复遗忘时刻**不变**、记录不存在 ⇒ `Fault(InvalidArgument)`、装配根忙 ⇒ `Fault(Conflict)`（用**另一条线程持锁**触发——同线程 `try_lock` 在 Windows 上是未定义形状，MUST NOT 依赖它）、请求级拒绝经接缝后仍是 `Rejected`。顺带给 `PurgeState` 补 `ALL`（与 `ForgetTrigger` / `MemoryKind` 对称，路由解析要遍历它）。**非空洞注入 3 组共 7 红**（I1 拒绝折成 `200+[]` ⇒ 1；I2 取数按 session 预筛 ⇒ 3；I3 `impl` 不调 `read_memory` 直接返回空 ⇒ 3），每组 ≥1 且 `sha256` **逐字节**还原（注入 MUST 用编辑工具，MUST NOT 用 Python 读写往返——会统一换行符使校验失效）。门控 `EXIT=0`：95 目标 / **940 passed** / 0 failed；Node 13 / 319 / 0；对照 W109（**924**）⇒ **+16**，与上述两处新增**逐项吻合**，且都落在**既有测试目标内** ⇒ Rust 目标数与 Node 根数**均不变** ⇒ **无需** `engineering_checks` 登记。**status 仍 `pending`**——本轮闭合的是「执行体 → 调用方」，**不是**验收达标：§42.4 的**清除副本**一侧仍未建（一条被遗忘的记录**仍在库里**，只是读不出来，端点响应已如实写明）、`MemoryPolicy` 本轮无配置项（来源是装配点，默认观众长期记忆关闭）、Pro 跨会话（§42.5）未覆盖。见 docs/reports/2026-10-15-w110-memory-control-surface.md、docs/adr/0088-memory-control-surface.md、openspec/changes/archive/2026-10-15-w110-memory-control-surface/。【W111 清除侧：从「字段」变成「动作」，验收仍保持 pending】立项判据**先跑红**：请求体给 purge_state=complete + claims_fully_erased=true 被**接受**，而 memory_records.content 原文未动 ⇒ §42.4「清理侧给出完成状态」与「MUST NOT 宣称已完全擦除」同时落空，且与 W110 报告的如实披露**自相矛盾**。W111 **删除**这两个**结论**字段（留同名按未知字段拒 400，MUST NOT 静默忽略——那等于把缺陷换位置）、**保留** third_party_retention（**事实**，只有调用方知道）；新增 `Store::purge_memory_body`（content 置空 + purged_at_ms，**只置一次**、**行保留**为 tombstone）与 `Store::memory_body_purged_at`（body_purged 由**存储读出**，不是入参）；新增拒因 `ErasedClaimWithoutPurge`（ALL 23 → **24**）；判定顺序（Complete → body_purged → 留存）由**可达性**决定。执行体 `Composition::purge_memory`：先阻断 → 再清载荷 → 再清点副本清单 `COPY_SITES`（**闭世界，当前空集**，由代码派生的落点集合钉住；空集 MUST 被清点并报 0）。迁移 0009-memory-purge.sql，VERSION 8 → **9**（版本号**五**处同改）。注入 3 组 **7 红**（I1 只记时刻不清载荷 ⇒ 3；I2 控制面重新接受结论字段 ⇒ 3；I3 登记不存在的清除体 ⇒ 1），sha256 逐字节还原。**status 仍 pending**——闭合的是「清除侧：字段 → 动作」，**不是**验收达标：远端留存清除、介质级擦除（明确不做）、Pro 跨会话 §42.5 未覆盖。见 docs/reports/2026-10-15-w111-memory-purge-surface.md、docs/adr/0089-memory-purge-surface.md、openspec/changes/archive/2026-10-15-w111-memory-purge-surface/。【W112 钉死 §42.5 跨会话边界在 memory 面的判定面（H03 写入面 + 跨场授权）】runtime 补 2 项（跨 viewer_scoped_id 查观众记录 ⇒ OutOfScope；场次记忆跨会话保留：旧场物理保留、对新场 OutOfScope、不删行）；控制面补 1 项（跨场 token 访问本场 memory 路由 ⇒ 401）。2.1／3.3 归属既有测试。观众 authorization_ref 只查非空、不验属于当前 session（决策 4，遗留）。**零生产代码改动**。status 仍 pending——判定面闭合 ≠ 验收达标；Pro 跨会话运营（§14.1）未建。见 docs/reports/2026-10-15-w112-memory-cross-session-boundary.md、docs/adr/0090-memory-cross-session-boundary.md。"}
  - {id: "H04", title: "记忆读取与作用域：跨作用域读取被拒；观众长期记忆默认关闭", release_line: r1, contract: "memory.access@1", automation: unit, status: pending, evidence: "reports/2026-10-11-w57-memory-read-write-surface.md", notes: "【W57 落点：判定机制已交付，验收保持 pending】§42.3 的关键词是**顺序**（先作用域、再时效）与**不得静默**（不得用近似条目顶替），既有代码**没有读取路径**（只有 viewer_record 的字段级校验）⇒ 作用域过滤、撤销、权限、近似顶替、配额裁剪全部零落点。W57 补上 MemoryScope／MemoryQuery／ScopedRecord／MemoryReadOutcome／read_records：**请求级**拒绝有 invalid_scope（作用域不完整，不得就近匹配）、viewer_memory_disabled（默认关闭）、viewer_read_without_authorization、viewer_read_without_purpose、approximate_substitution_requested（把「不许顶替」写成**可被拒绝的请求**而非注释）；**条目级**拒绝写进 refused 并**逐条具名**——out_of_scope／expired／revoked／permission_denied／approximate_substitution／over_budget。**裁剪可见**是刻意的：被裁条目必须具名，否则「被裁掉」与「本来就没有」无法区分（同 §44 对工具循环的「无静默截断」）。超配额按「**场次 > 工作 > 观众长期记忆**」的固定优先级裁剪（保留原序，不重排）。观众长期记忆需授权引用 + 用途记录，缺任一项以「无记忆」继续且不写画像。测试 crates/nai-kernel/tests/memory.rs 21 项，含**顺序断言**（同时越作用域又过期、又撤销、又无权限、又是顶替条目的记录，报的是 out_of_scope ⇒ 证明「先作用域后时效」不是注释）与优先级非空洞守卫（budget=2 时保 s1/w1、裁 v1/w2；若按输入序取前二则会得到 w1/v1 ⇒ 该用例能区分「按优先级」与「按顺序」）。**为何仍是 pending**：同 H03——读取面是纯判定函数，真实记忆子系统与生产接线未建。见 docs/reports/2026-10-11-w57-memory-read-write-surface.md、docs/kernel.md、openspec/changes/archive/2026-10-11-w57-memory-read-write-surface/。【W107 裁定：读取面**不在本轮**，登记为具名开放问题】本轮（W107）只接线 H03 的**写入面**，`read_records` 在生产代码里**仍是零调用方**。**为什么不顺手接**：`read_records(records: &[ScopedRecord], query, policy, now_ms)` 的条目级门控输入是 `ScopedRecord` 的 `revoked` / `permitted` / `approximate_of` —— 其中 `permitted` 可由 permission_grants 诚实派生、`approximate_of` 恒 None，但 **`revoked` 在 `memory_records` 里没有任何承载列**，而 §42.4 的遗忘链是一条**真实状态**（ReadSideNotBlocked / ErasedClaimWithoutCompletePurge / ErasedClaimWithThirdPartyRetention / ThirdPartyRetentionUndisclosed 四条拒因都在描述它）⇒ 在读取面写死 `revoked: false` 就是**凭空断言一条判定输入**，正是本项目明令禁止的「注入**判定**而非注入**事实**」（W94 的形状）。**开放问题的形状**：「如何诚实派生 `revoked`」需要一个新的承载物（`memory_records` 加撤销列，或遗忘链另设落点），且必须随之付**一次迁移**；在那之前 H04 的 runtime 接线**不做**。**配套已落地的是取数入口** `Store::memory_records(op, workspace, actor, session)`（逐列还原九字段、按 (workspace, session) 过滤、`ORDER BY record_id`），它是**存储层取数**而**不是** §42.3 的读取面——MUST NOT 施加越作用域/过期/撤销/权限/近似顶替/配额六类判定，也 **MUST NOT 被读作「H04 已接线」**（有一项测试专门钉它：已过期记录**仍被读回**）。**status 仍 `pending`**。见 docs/reports/2026-10-14-w107-memory-write-gate-wiring.md、docs/adr/0085-memory-write-gate-wiring.md。【W109 接线：读取面已接上真实存储，验收仍保持 pending】W107 登记的具名开放问题「`revoked` 在 `memory_records` 里没有承载列」**已闭合**——W109 新增 `0008-memory-revocation.sql`（`ALTER TABLE memory_records ADD COLUMN revoked_at_ms INTEGER;`，可空、NULL = 未撤销）、`migration::VERSION` 7 → **8**（版本号**五**处同改：`VERSION`／`SQL` 数组／`backup.schema.json` const／Rust 契约样本断言／**Node 备份样本**），TS 生成物由 `cargo xtask schema` 再生并真验 `--check` ⇒ `no drift`。`Composition::read_memory(query, policy, now_ms)` 是 `read_records` 在生产代码里的**第一处**调用方：**先**用 `Store::memory_scoped` 取一个工作区的全部记忆行（**只按 `workspace_id` 过滤**——⚠️ 刻意**不**按会话预筛，否则 `out_of_scope` **失去对象**＝假阴性，已由注入 I2 实测：实测集合里 `OutOfScope` **整个消失**），**再**逐条**诚实派生**三个条目级输入：`revoked` ← `revoked_at_ms.is_some()`；`permitted` ← 该记录**所属类别**要求的授权是否在场（观众记忆看记录**自己**的 `authorization_ref`，其余类别 §42.3 无记录级授权要求 ⇒ 结构蕴含；⚠️ **刻意不查 `permission_grants`**——取数入口已要求同一条 `session.manage`，条目级再查一次则二者**恒一致** ⇒ `PermissionDenied` 永不可达＝守卫无对象可守；而 `admit_write` 不要求观众记录带授权引用 ⇒ 缺授权引用的观众记录**可入库但读不出来**，`PermissionDenied` **可达**，有用例专门钉它）；`approximate_of` ← 恒 `None`（存储里结构上不存在顶替条目）。请求级违规 ⇒ `MemoryReadError::Rejected`（**整个读取不成立**，MUST NOT 折成一次「空读取」——否则它与「读出来零条」不可区分）；条目级违规 ⇒ 逐条进 `refused` 并具名。**判定一次**：存储层只取数与阻断，不施加 §42.3 的六类判定。`Composition::forget_memory` 是 §42.4 的**阻断**落点：**先**阻断（写撤销列；重复阻断返回**原有**时刻，**不覆盖**——撤销时刻是一条事实）**再**判陈述；`read_side_blocked` **不是**调用方字段（否则调用方可构造恒真 `ForgetOutcome`，判定变装饰）⇒ `ReadSideNotBlocked` 经本入口**结构上不可达**，已在守卫的闭世界里具名登记。测试 `crates/nai-runtime/tests/memory.rs` 由 **9** 项增至 **18** 项（新增：越作用域**未被预筛**／已过期／已撤销／权限不足**可达**／超配额裁剪可见／**顺序断言**（同一条四层同时违反 ⇒ 报 `OutOfScope` 且**只报一次**）／阻断后再读 ⇒ `Revoked`／重复阻断时刻不变／端到端可达集合）；非空洞守卫**双向**钉：`cover` 对 `MemoryRejection`（23 变体）**穷尽 match**（`NOT_CONSTRUCTED_HERE` **恰为** `UnknownOperation`／`ApproximateSubstitution`／`ReadSideNotBlocked` 三条，每条写明承载处）+ 端到端用例断言**实测观察**集合 == `READ_FORGET_FACE`（13 条）⇒ 「分类说可达」与「真的产生得出来」两头都钉。`crates/nai-storage/src/migration.rs` 增 v7→v8 升级路径实测（在**已有行**的库上：九列逐字保留 + 撤销列默认 **NULL**，MUST NOT 是 0——0 会被读成「1970 年就已撤销」而把每行老记忆一次性判死）。**非空洞注入 3 组共 5 红**（I1 派生写死 `revoked: false` ⇒ 2 红；I2 取数按 session 预筛 ⇒ 2 红；I3 阻断改覆盖写 ⇒ 1 红），每组 ≥1 且 `sha256` **逐字节**还原。⚠️ 顺带修一处 VERSION 7→8 带出的**回归**：既有 `version_six_upgrade_...` 用 `SQL.iter().take(VERSION-1)`，版本号一升就自动前移、实际改测 v7→v8 而**用例名变成不实陈述**，0007 那条升级路径**失去覆盖且零信号** ⇒ 钉住 `const ASSEMBLY_KIND: usize = 7`（MUST NOT 用 `VERSION - 1`）。**status 仍 `pending`**——本轮闭合的是「判定面 → 执行体」，**不是**验收达标：控制面接线、§42.4 清除副本一侧、Pro 跨会话（§42.5）仍未建。见 docs/reports/2026-10-15-w109-memory-read-surface.md、docs/adr/0087-memory-read-surface.md、openspec/changes/archive/2026-10-15-w109-memory-read-surface/。【W110 接线：控制面已接上，验收仍保持 pending】W109 让 `read_records` / `forget` 有了第一处生产调用方（装配根的 `read_memory` / `forget_memory`），但**那两个入口自己仍零调用方**（实测：在非测试的 `.rs` 里检索 `read_memory` / `forget_memory` ⇒ **零命中**）⇒ 链子最上面一环是空的。与 W103–W109 **连续第七轮同型**，**不同的一点**：前几轮缺**执行体**，本轮执行体已存在、缺的是**调用方** ⇒ **纯接线轮**：**零迁移、零契约字段改动、零 schema 改动**。**接缝由分层定位**：`xtask/src/deps.rs` 禁止 shared 依赖 runtime ⇒ `trait MemorySurface` **在 `nai-control-api` 定义**、`nai-runtime` 的 `MemoryAdapter{root, policy}` 实现、**app 注入**；后端未注入 ⇒ `503 CAPABILITY_NOT_READY`，MUST NOT 以空结果假成功。⚠️ **签名不带 `now_ms` 与 `MemoryPolicy`**（时间源只在一处；策略由装配点给定，否则 `viewer_memory_enabled` 被答两次）。**两个端点** `POST /api/v1/memory/read`（`memory.read`）／`POST /api/v1/memory/forget`（`memory.forget`）——控制面**一律禁 query**，故读取也走 `POST` + body。**三态不丢维度**：判定拒绝 ⇒ `422` + 判定自己的名字（**MUST NOT** 折成 `200` + 空 `records`）；路径故障 ⇒ 按 `ErrorCode` 映射（装配根忙 ⇒ `409`），**MUST NOT** 报成判定拒绝。**作用域是控制面自己的绑定**，请求里的 `workspace_id` / `session_id` 一律忽略 ⇒ 越作用域判据仍**有对象**可拒（若作用域可由请求指定，隔离边界由被隔离者填）。**「没给输入」≠「空集」**；缺省一律取**安全方向**。测试 `crates/nai-control-api/src/tests.rs`（**26** 项，+11）与 `crates/nai-runtime/tests/memory.rs`（**23** 项，+5）：接线成立由 `RecordingSurface` **记录调用**证明（恒真桩会让「接线」变成装饰）；「装配根忙」用**另一条线程持锁**触发（同线程 `try_lock` 在 Windows 上是未定义形状，MUST NOT 依赖）。**非空洞注入 3 组共 7 红**，每组 ≥1 且 `sha256` **逐字节**还原。门控 `EXIT=0`：**940 passed** / 0 failed（W109 为 924 ⇒ **+16**，与两处新增逐项吻合）。**status 仍 `pending`**——闭合的是「执行体 → 调用方」，**不是**验收达标：§42.4 **清除副本**一侧仍未建（被遗忘的记录**仍在库里**，只是读不出来）、Pro 跨会话（§42.5）未覆盖。见 docs/reports/2026-10-15-w110-memory-control-surface.md、docs/adr/0088-memory-control-surface.md、openspec/changes/archive/2026-10-15-w110-memory-control-surface/。【W111 清除侧收口，验收仍保持 pending】清除执行体落地后，「已撤销 ⇒ 读不出来」不再是全部：清除把 content 置空（**行保留**为 tombstone），读出面因此面对两条独立事实——已撤销 + 空载荷。零执行的「已完全擦除」宣称被**具名拒绝**（ErasedClaimWithoutPurge），且 body_purged 由**存储读出**而非判定自认。远端留存清除与 Pro 跨会话（§42.5）仍未覆盖。**status 仍 pending**。见 docs/reports/2026-10-15-w111-memory-purge-surface.md、docs/adr/0089-memory-purge-surface.md。【W112 钉死 §42.5 跨会话边界在 memory 面的判定面（H04 读取面 + 作用域事实）】runtime 补跨 viewer_scoped_id ⇒ OutOfScope（2.2）＋ 场次记忆跨会话保留（2.3）；control-api 补跨场 token ⇒ 401（3.1）＋ 作用域来自控制面绑定、请求伪造被忽略（3.3 归属）。**零生产代码改动**。status 仍 pending——判定面闭合 ≠ 验收达标；Pro 跨会话运营（§14.1）未建。见 docs/reports/2026-10-15-w112-memory-cross-session-boundary.md、docs/adr/0090-memory-cross-session-boundary.md。"}
