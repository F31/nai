  - {id: "A08", title: "档位升级不重装内核", release_line: r2, automation: manual, status: implemented, evidence: "reports/2026-10-10-w25-tier-idle-migration.md", notes: "档位迁移图是两段差集的并（tier_plan：Lite→Pro = Standard 与 Pro 增量之并，不要求先装中间档；反向为其 remove），集合为常量故不可能含内核——「不重装内核」是数据的性质而非需要记住的规则；驻留账本用声明式足迹且只在 enable 时物化，故「未启用插件无后台进程、端口、显存或云请求」是结构性质（held 只由 enable 写入，audit 可检出违规），见 tests/lifecycle.rs 17 项。真实设备上的进程/显存占用与档位加装未实测，保持 implemented 不标 tested"}
  - {id: "A09", title: "空闲回收", release_line: r2, automation: manual, status: implemented, evidence: "reports/2026-10-10-w25-tier-idle-migration.md", notes: "空闲释放按 TTL 分族（临时 worker 30s / 端口随其进程 30s / 未用预览云请求 60s / 模型显存 300s，方向由重载代价决定），reclaim 只释放 TTL 已到期项并如实报告 held_back（否决立即释放：代价是下一句一次完整模型重载）；正在服务会话的能力绝不被回收，回收只动资源声明、不改启用状态、不删数据；audit_residency 六个稳定标记，其中 idle resource past its ttl 是可达的泄漏检测，其余为改错时的守卫，见 tests/lifecycle.rs。真实回收（结束场次后真实进程/显存释放、未安装模块零后台资源）需设备与媒体宿主里程碑，保持 implemented 不标 tested"}
  - {id: "A10", title: "云断连不伤本地链路", release_line: r2, automation: fault, status: implemented, evidence: "reports/2026-10-10-w26-cloud-disconnect.md", notes: "本地关键链路以依赖方向图表达；audit_local_autonomy 对每个关键节点求传递闭包并断言不含云节点（两跳与直连同属可达；三类稳定标记区分「依赖云」「不是本地」「未声明」）；可用性是链路状态与节点归属的函数，本地节点在两种链路下均 Available，云节点断连以 cloud link unreachable 失败关闭；CapabilityGate::disconnect 只遍历云条目故本地不受影响，reconnect 把云能力落到 NeedsPrepare 而非 Active（§27.3 不自动恢复旧 Auto，须显式 activate）；低云容量只能由 Sizing::Measured(instances, load_pct) 构造，Unmeasured 以 CAPABILITY_NOT_READY 拒绝且无零默认值，assess 报出全部越界族，超预算而策略为 Absorb 时 audit_low_cloud 报违规；见 tests/cloud.rs 21 项。真实断网/弱网注入与真实云 SDK 未接，云链路由宿主注入，保持 implemented 不标 tested"}
  - {id: "A11", title: "Pro 多会话隔离", release_line: r3, automation: integration, status: implemented, evidence: "reports/2026-10-10-w27-multi-session-isolation.md", notes: "每会话命名空间以 session_id 为键并各有独立 epoch（advance_epoch 只推进被点会话）；到达 lane 的唯一入口 access(requester, owner, lane) 以属主为键，requester≠owner 即 CONFLICT，故「任务/音频/审批/预算/知识无串场」是签名性质而非检查（否决全局 lane 表+检查、类型级隔离、lane 不设属主）；共享面是封闭三枚举 ImmutableModel/KnowledgeSnapshot/ConnectionPool，活的 lane 状态没有可共享表示，SharedPool::write 永远 PERMISSION_DENIED（只读），连接池持有者上限满即 RESOURCE_EXHAUSTED 且零上限在构造时即拒；Admission 四族（GpuThroughput/Vram/AudioTiming/ApiQuota）独立判定，admit 两阶段——先按族汇总并对照全机总量检查，全部通过才写用量，任一族不足即 RESOURCE_EXHAUSTED 且不写任何用量（被拒会话为 0、已开播会话数字不变，对应「不能让已开播会话 OOM」），未声明族按 0；audit_isolation 检出无持有者租约与重复 session id；落 nai-kernel（只依赖 contracts，18 包不变），见 tests/multiplex.rs 24 项。真实多路会话与真实音频时序未做（准入用宿主给定上限表），保持 implemented 不标 tested"}
  - {id: "A12", title: "桌面壳宿主边界", release_line: r1, automation: manual, status: pending, evidence: "reports/2026-10-11-w54-desktop-shell-boundary.md", notes: "【本轮落点（W54）】本项此前**不存在**：docs/adr 的 44 篇里没有桌面壳形态这一条，apps/desktop 是纯 Web（deps 只有 react/react-dom/vite），而 §1151（capabilities/CSP 最小权限）、§1259（sidecar 三元组与 UI 父子生命周期）、§900（数据根）、§1101（同机优先受保护 IPC）四组条款在全仓零命中。W54 交出 ADR 0046（形态 = Tauri 2，§1248）＋ apps/desktop/src-tauri/{tauri.conf.json, capabilities/default.json, shell-policy.json}（**Tauri 2 真实格式**；不引入 tauri crate、不建 Rust 主体、workspace 仍 19 包、零新增依赖）＋ tests/ui/desktop-shell.test.mjs（15 项，经既有 test:ui 自动进入 full 门控）。边界内容：①壳只做四件事（窗口与托盘生命周期／受保护 IPC 宿主侧／数据根解析／sidecar 拉起与监督），业务语义（会话·守门·审批·知识·媒体编排）命中即失败（§17.5、§181）；②最小权限面**逐一相等**——多授少授都失败，且权限标识符须形如 core:模块:allow-动作，core:default 一类**聚合权限集**被拒（§1151 的『只开放必要』是上界断言，『包含』只证下界）；③CSP 无 unsafe-eval、任一指令无通配源（*／http:／https:／ws:／wss:），connect-src 必须含 ipc:；④sidecar 声明写**不带三元组**的逻辑名且必须对应 apps 下真实存在的二进制包，命名规则为『包名-目标三元组(+.exe)』（§1259）；⑤后台生命周期不绑界面（backendsOutliveUi 为 true、webviewKeepAliveRequiredForBackends 为 false）；⑥三形态（windows／macos／mobile-route-b）**共用同一套边界**，差异只允许落在目标与分发上（§10.2 路线 B、§10.3）。**INV-18『内核不依赖 Tauri』本轮不重复实现**——它已由 xtask/src/deps.rs 的 tauri 前缀检查与单测夹具强制（见 A04），ADR 0046 只引用它。**非空洞守卫**：注入 shell:allow-execute、core:default、unsafe-eval、通配源、@tauri-apps/plugin-fs、未登记 sidecar、backendsOutliveUi=false 等样本，各检查必须分别抓到（否则『配置通过』与『检查恒真』无法区分）。**未升级（为何是 pending 而非 implemented）**：§1248/§1260 的真值是**可运行、可打包、可签名**的壳体——本轮无 tauri crate、无 Rust 壳主体、未打包未签名；真实 WebView2 构建、安装器与 Windows 代码签名链属发布里程碑。**已知后果（如实登记，非缺陷）**：形状校验**不能**证明配置被某个 Tauri 版本接受；Tauri 大版本改动配置字段时本仓检查**不会自动发现**；tauri.conf.json 的 $schema 指向官方 URL、**离线不可校验**（故校验自建、不依赖网络）。见 docs/adr/0046-desktop-shell-form-and-tauri-boundary.md、docs/reports/2026-10-11-w54-desktop-shell-boundary.md"}
  - {id: "A13", title: "平台能力矩阵与源码一致", release_line: r1, automation: unit, status: tested, evidence: "reports/2026-10-11-w55-platform-boundary-matrix.md", notes: "【本轮落点（W55）】本项此前**不存在**：平台维度在 registry 里没有任何表达（全部验收按业务分系列，release_line 只表达 Slice-0/R1/R2/R3/实验），而全仓含平台条件编译的文件已有 23 个、116 处——没有一处被登记过。W55 交出 schemas/platform-matrix/platforms.json ＋ platforms.schema.json ＋ scripts/platform/matrix.mjs ＋ tests/platform/platform-matrix.test.mjs（22 项，经 engineering_checks 自动进入 portable 与 full 门控）＋ docs/platform-matrix.md。内容：①平台集合与目标三元组的**显式声明**（windows 首发／linux 轻云与 WSL／macos 后续 r2+r3／ios ＋ android 实验），发布线取值限于仓库既有五条；②每项能力在每个平台上**都必须有状态**，键集合与平台集合逐一相等——『这个平台没提』与『这个平台不支持』不得混为一谈；③状态三态封闭 supported／explicit-unavailable／out-of-scope，explicit-unavailable **必带**理由码且理由码**从 nai-plugin-sdk 的 UnavailableReason::label() 源码派生**（不在校验里另立常量表，Rust 侧新增变体无需改脚本、用了不存在的码立即失败），supported **必不带**；④**核心门控**：全仓含平台条件编译的文件（cfg(windows)／cfg(unix)／cfg(target_os=...)／cfg! 形式／Cargo 的 [target.'cfg(...)'.x] 段）MUST 是矩阵登记路径的**子集**——新增一处平台分支而不同步矩阵即失败并指名文件；⑤bound_to 声明某原生平台依赖的能力，在其它平台上 MUST NOT 是 supported（把『抖音 SDK 是 Windows 原生目标』一类事实变成可判定断言，无需在校验里硬编码能力 id）；⑥macOS 的 release_lines 必须含 r2 与 r3（用户拍板，落为**数据断言**而非文档叙述）。**登记到的已存在却从未被登记的事实**：ADR 0017 已裁决共享内存帧槽为 Linux tmpfs-file **工程演练**后端并明文『Windows/非 Linux 后端明确 CapabilityNotReady，不改变 Windows 正式共享内存目标』；NativeVault 在非 Windows 上**显式**返回 CapabilityNotReady（失败关闭，非静默降级）；而 data-root 的 0700 权限、path-containment 的链接拒绝、process-supervision 的退出状态在 unix 家族（**含 macOS**）**已有落点**。**非空洞守卫**：注入未声明平台键、缺平台、坏理由码、PascalCase 变体名、unavailable 无理由、supported 带理由、悬空 source_files、未登记的平台分支文件、macOS 丢 r3、Windows 绑定能力在 macOS 标 supported、source 类无证据、baseline 类登记文件、重复平台 id、非法发布线、坏三元组，各检查**分别抓到**；另有一条『扫描非空且命中已知分支』守卫，防核心门控因扫描恒空而恒真。**未升级**：不使任何既有 status 升级；零 Rust 业务改动（仅在 xtask 门控增一行命令）、零新增依赖、workspace 仍 19 包【W122 回填：升 implemented → tested】证据链已实测核实——tests/platform/platform-matrix.test.mjs 的 22 项断言经 xtask engineering_checks 在 portable 与 full 门控内自动执行（本机门控实测 TAP 汇总 1..22 / # pass 22，0 fail）；其中核心门控「全仓含平台条件编译的文件 MUST 是矩阵登记路径的子集」与 15 条非空洞注入守卫分别抓到；本项命题为**静态结构事实**（矩阵 ↔ 源码扫描 ↔ SDK 枚举标签一致），无外部依赖，故具备完整认证证据。。"}
  - {id: "A14", title: "macOS 覆盖 Standard 与 Pro", release_line: r2, automation: manual, status: pending, evidence: "reports/2026-10-11-w55-platform-boundary-matrix.md", notes: "【新增需求，非基线承诺】基线 V3.11 全文对 macos／darwin／apple 的命中数为 **0**（随基线订正重新实测，V3.9 亦为 0；只有 Windows 首发、Linux 轻云与 WSL、iOS／Android 实验），registry 亦无任何平台维度条目 ⇒ 本项缺基线判据、缺验收标准、缺目标三元组、缺签名与分发策略。**用户拍板**：macOS 覆盖 R2（Standard）与 R3（Pro）；已落为数据断言（platforms[macos].release_lines 含 r2 与 r3，由 A13 的校验钉住），故本项验收的真值是『这两条发布线的能力水平在 macOS 上成立』。**两处硬约束（如实登记，不是缺陷）**：①§14.1 把『抖音连接器与事件治理』列为 **Standard 的核心构件**，而 §9.2 抖音与 §687『Windows 原生是 SDK、音频与写实的正式运行目标』说明抖音 SDK 与 Windows 音频是 **Windows 原生目标** ⇒ 平台 SDK 在 macOS 上登记为 explicit-unavailable{no_official_interface}，**不假定存在等价接入路径**（用户拍板『如实登记为不可得』），本仓库不臆造 macOS 侧抖音方案；②§300 写实的加速路径为『Windows NVIDIA CUDA 首发』、TensorRT 与 **DirectML（Windows 专属）** 单独认证 ⇒ macOS 侧需另定路径，**尚未裁决**。因此 macOS 上的 Standard 与 Pro 内容 MUST 与 Windows 档位表（§14.1）**分别定义**，不得照搬。**缺失前置**：macOS 目标三元组进入构建与 CI；系统密钥保护后端（unix 家族当前 explicit-unavailable{not_ported_to_target_os}，macOS 需系统密钥库后端）；共享内存帧槽的正式后端（ADR 0017 只交了 Linux 演练后端）；macOS 侧写实加速路径的裁决与实现；代码签名与**公证（notarization）**链；Apple 开发者凭据；安装器与分发；真实设备与媒体验收。**已然可复用的部分**：data-root 解析与权限、path-containment 的链接拒绝、process-supervision 的退出状态在 unix 家族（含 macOS）**已有实现落点**。**状态保持 pending**：登记归属不等于开始实现，本项 MUST NOT 被读作 macOS 已排上日程或已支持；亦不因此使任何其它验收升级。"}
  # B 系列：业务质量
  - {id: "B01", title: "知识质量门槛", release_line: r1, automation: integration, status: blocked, evidence: "reports/2026-10-10-w31-golden-set-payload.md", notes: "【口径】规格 §655 的 B01 验收是「100 题集达到第 6 章门槛」＝实测达标；题集内容与真实模型评估未接，达标不可能达成，故为 blocked。本项已交付的是判定机制（W30）与载荷载体（W31，见本项 notes 末段）。判定机制：黄金集绑定场景版本、覆盖 §5.9 八类（NormalAnswer/FactUpdate/Injection/Conflict/PrivilegeEscalation/NoAnswer/Cancelled/ToolReturnAttack）并受 MINIMUM_CASES=100 约束，audit_coverage 在运行前报出 below_minimum_cases/category_uncovered/expectation_category_mismatch（用例配置缺陷与系统失败分开并指向用例 id，否决运行时计为系统失败）；Recall@5 钉成题级判定——全部所需证据进前 RECALL_K=5 才计命中，集级分母为有证据题数、目标 RECALL_AT_5_TARGET_PERMILLE=900，文档粒度 evidence_doc_recall_at_5 仅作对照且两口径分开呈现（否决单报文档粒度：对一题 5 证据与一题 1 证据等权会掩盖整题失败）；三份正确率是三个独立字段、无任何合成方法（否决加权质量分）——检索侧 evidence_recall_at_5、生成侧 answer_accuracy（AnswerVerdict::Unknown 从分母排除，全未判定即未测量而非 0%）、检索延迟 retrieval_p95_ms 复用 metrics 的 LatencySamples（<20 样本即未测量、门槛计为未达标，恰好 300ms 判达标）；四条否定式判据为逐用例一票否决——HighRiskFact 只对自动播报生效（澄清/转人工/拒答皆正确，播报其它断言不违规）、MustClarifyOrEscalate 把「自动播报」与「拒答但未澄清」分开报、MustNotAct 逐条列出副作用、MustCancel 记结束方式；regression 四条拒绝——版本不一致 VERSION_INCOMPATIBLE（跨版本不比较）、候选任一门槛失败 candidate_gate_failed（基线不绿也不放行候选）、逐用例由通过变失败 case_regressed（1000‰→989‰ 亦拒，不因平均分未降而放行）、召回或正确率低于基线 recall_regressed/accuracy_regressed；BadCasePool 入池开放、出池须具名确认人（空即 PERMISSION_DENIED，越界 INVALID_ARGUMENT），CaseOrigin::Promoted 保存确认人故未确认候选无法伪装成 authored；audit_report 对上报值做纯函数（cases_run_exceeds_total/recall_exceeds_unity/accuracy_exceeds_unity/unmeasured_field_reported/measured_field_unmarked）；落 nai-kernel（只依赖 contracts，18 包与依赖方向不变），见 tests/golden.rs 24 项。【载荷载体（W31）】题集的唯一位置是 §30.1 指定的 tests/rag-golden（*.json），结构见 schemas/rag-golden/case-set.schema.json（case_set_schema const 1、scenario_version、cases；expectation 五形 evidence/high_risk_fact/must_clarify_or_escalate/must_not_act/must_cancel；origin 两形 authored/promoted+非空 confirmer；additionalProperties false 全面拒未知字段）；题集是场景包载荷（§5.9 场景包字段含黄金集 ⇒ 逐场景各一份；§6 至少 100 个贴近真实直播的问题且标注（设计值）），三条人工来源＝按场景编写/随场景包发布/坏案例经具名人工确认回流，仓库不生成题内容也不硬编码任何一题；cargo xtask check --golden [--dir] 把三种结论分开——目录内无 *.json ⇒ CAPABILITY_NOT_READY（未提供，指出被搜索目录，不是通过也不是失败）、有文件但读不出 ⇒ 逐个报出全部结构缺陷（文件名+JSON 路径+稳定 token，含 case_set_schema_unsupported/json_invalid/unknown_field/field_missing/field_empty/field_type/category_unknown/expectation_kind_unknown/origin_kind_unknown/duplicate_case_id）、读出但不达 §5.9/§6 ⇒ 报全部 finding（below_minimum_cases/category_uncovered/expectation_category_mismatch）；is_unsupplied 以 files==0 为唯一判据（否决由 sets.is_empty() 推断：有文件但全被拒会被误报成从未提供）；promoted 缺或空白 confirmer 在读取载荷时即拒（§5.9 授权边界前移，使含未确认候选的题集不会先参与召回统计而被误读为系统表现差）；该命令不并入 check --profile portable（业务题集未建不应让工程基础门控变红）；落 xtask（tool 层，复用 kernel 的 GoldenSet/audit_coverage/MINIMUM_CASES 不复制判定，lib 目标在便携门控内被覆盖），新增 xtask→nai-kernel 依赖边属 tool 层允许，check-deps 仍 18 包方向不变、外部依赖零新增，见 xtask/src/golden.rs 17 项。真实 100 题集内容、真实模型评估与真实检索质量未接（答案正确性由调用方判定后注入）；tests/fixtures/rag-golden/example-min.json 是夹具（8 例最小集，验证加载器本身）不是真值。W36 起真实文本模型已可用并经本栈实测（OpenAI 兼容网关，见 reports/2026-10-10-w36-live-provider-evidence.md），但 100 题集内容与完整评估仍未接。【参考答案与执行体（W40）】题集修订 2 起每题**必填** expected（must_include 至少一条、must_exclude 可选），判定是 kernel 纯函数 judge_answer（归一化子串匹配、**否定式优先**、空判据返 Unknown 而非 Correct），见 crates/nai-kernel/src/golden.rs 与 tests/golden.rs（31 项）；修订 1 **不做双读**（旧题集被拒而非读成「无参考答案要求」；xtask 39 项）。新增**评估执行体** xtask/examples/golden_eval.rs（cargo run -p nai-xtask --example golden_eval [--dir <目录>] [--evidence <文件>]）：复用门禁**自己的**读取器（read_case_set/case_set_files 与审计共用 parse_case_set，故「读得进」与「门禁放行」是同一件事），经真实 TextGenerator 逐题生成并用 GoldenCase::answer_verdict 判定；缺题集/结构不合规/缺凭据一律 CAPABILITY_NOT_READY（退出 1）且**不发起任何调用**（凭据只报变量名、绝不打印或入库），真实调用失败退出 2。**只驱动生成侧**：检索召回、检索 P95 与行为类判据（澄清/转义、无副作用、取消）具名打印为未驱动且**不填零**，并明示「不是 B01 达标」——否决用答案文本猜 outcome 喂 evaluate（会造出行为类假失败、注入类假通过的失真报告）。实测：夹具 tests/fixtures/rag-golden/example-min.json（修订 2）8 例 → 8/8 judged / 0 correct（占位问题与夹具参考答案不匹配，正确率无意义，只证链路通）；临时探针 1 例 → 1/1 correct（证明判定双向往返可用）。**缺口从四段降到两段**：①100 题题集内容与 ④真实知识库内容，均为场景包产出方外部投入。**两段的充分性不同**：①到位即让就位门禁放行并出生成侧 answer_accuracy（判据与执行体均已就位，零代码改动）；④到位**本身不产生**检索侧结论——执行体的未驱动项是**常量**（xtask/examples/golden_eval.rs 的 UNDRIVEN：evidence_recall_at_5/retrieval_p95/behaviour_expectations，无条件打印），故 Recall@5、检索 P95 与行为类判据要出数**仍需扩展执行体或另接采样器**。W40 原记「两者到位后零代码改动即可出完整结论」对**检索侧**不成立，此处订正（与 docs/golden-set.md「未做边界」一致）。零新增包（仍 18）、xtask 真实接线仅 dev-dependencies 故 portable 覆盖与耗时不变。见 reports/2026-10-11-w40-golden-eval-runner.md（附勘误）、ADR 0040（附勘误）。【素材来源（W50）】规格 §5.9 的三条题集来源未覆盖「外部语料取材」。本轮登记一份外部**素材**：**LiveChat**（ACL 2023，MIT/Copyright 2022 Xiaobing.AI，实测 2,411,678 条真实中文直播对话、346 主播；结构 [streamer_id, comment, response]），见 docs/reports/evidence/livechat-corpus-provenance.md。**素材不等于题集**且不使本项达标：素材只供「贴近真实直播的问题」（§284）的**措辞与语境**，不供产品知识库与每题的 evidence/expected；落地与处理在**仓库外**（E:/nai-external/livechat/，源数据 459M + 候选池 50M **不入库**）；已从 1,440,191 条对话提取 **154,812 条**提问候选（去重去噪；抽样验真约 78%，假阳性为含疑问词的陈述句），候选**不进仓库**、须具名人工确认后才入 tests/rag-golden（core 侧 origin.kind=promoted + 非空 confirmer 的既有机制）。**摄取安全**：.pk 为 pickle，先经 opcode 白名单（pickletools.genops，禁用 GLOBAL/STACK_GLOBAL/REDUCE/NEWOBJ 等）再加载，8 个文件全通过（自检非空洞：含 os.system 的 pickle 被具名拒绝）；解压先校验成员路径防 zip-slip。**可达性**：Google 全不可达（代理 502 CONNECT tunnel failed／直连 000）、HF/ModelScope 无镜像、上游无 tag/release ⇒ 全量只能由人下载。**覆盖有限**：抽样证明该语料可靠覆盖的只有「问题措辞」，对 §5.9 的非 normal_answer 类别（注入/冲突/越权/取消/工具返回攻击）基本不适用——初版按词映射类别的尝试因假阳性极高被整段移除（连麦/上麦是正常直播功能，非越权）。**缺口不变**：①100 题内容与 ④真实知识库仍是外部投入；本项**保持 blocked**。零仓库代码改动、零新依赖、零新命令与证据目录（载荷仍只在 tests/rag-golden）。blocked（§655 达标验收未达）"}
  - {id: "B02", title: "写实 Gate G0–G3", release_line: r2, automation: manual, status: blocked, evidence: "reports/2026-10-10-w32-realistic-gate-verdict.md", notes: "【口径】规格 §655 的 B02 验收是「写实 Gate G0–G3 与肖像、声线授权证据齐全」＝证据齐全并实测；合法完整模型与 Windows/CUDA 目标机证据未提供（D12），达标不可能达成，故为 blocked。本项已交付的是判定机制（W32）。判定机制：§8.2 四门各自独立判定为 Passed/Failed/Unmeasured（Gate::{SourceAndRights,Correctness,Realtime,Stability}），总体准入 Acceptance 由四门派生且无任何单分数——档位不要求写实且声明未启用⇒NotApplicable、模型不完整⇒Blocked、任一门 Failed⇒NotAccepted、任一门 Unmeasured⇒Unmeasured、四门全 Passed⇒Accepted；缺测既不是通过也不是零（帧率无窗口、音画偏差样本不足 MIN_PERCENTILE_SAMPLES=20、温度未读一律 Unmeasured 且阻断 Accepted）。G0：权重/代码/训练素材/肖像/声音五类权利各为 Established{basis}/Unverified/Absent，依据空白不算成立（「许可引用存在不等于证据通过」，D12 自身结论），任一 Absent 或链路不可取得或存在留在未声明 Python 服务的缺组件⇒Failed。G1：预处理/音频特征/生成/后处理四段在固定输入下对齐，任一段 Diverged⇒Failed，未运行或固定输入未指明⇒Unmeasured；§26.5 精度有序——非 FP32 精度在 FP32 之前认证⇒Failed（precision_without_fp32_baseline），INT8 无量化校准报告⇒Failed（int8_without_calibration）。G2：目标机未指明⇒Unmeasured，未与直播工具并发⇒Failed，帧率以窗口下限判稳定 25fps（MIN_STABLE_FPS=25，否决被突发拉高的平均）、音画偏差复用 W29 的 LatencySamples::percentile(P95) 判 ≤FRAME_SKEW_P95_LIMIT_MS=80（<20 样本 Unmeasured，恰好 80ms 判达标），显存/CPU/温度任一未测⇒非 Passed；全 GPU 是 PlacementReport 放置记录（非空且全 GPU）的性质，cuda_ep_registered 只是审计线索（§26.5 不以 CUDA EP 注册成功宣称全 GPU），虚假全 GPU 声明⇒Failed，如实记录 CPU 回落且指标达标仍可 Passed。G3：静音/取消/句边界/长播/OOM/进程重启/形象切换与输出恢复七场景，任一 Failed⇒Failed、未运行⇒Unmeasured、声明通过而证据引用空白⇒Failed（scenario_passed_without_evidence）。2D 回退（§8.4 需运营预先授权、句间切换、写日志）是运营记录、与准入正交，不进入 verdict/acceptance；「以 2D 回退构成写实验收」永远违规（fallback_claimed_as_acceptance；§8.2 自动回退 2D 不等于写实验收通过）。无豁免路径；§1311 缺模型⇒Blocked、NotApplicable 只用于不要求写实的档位（Lite），Standard/Pro 声明不适用被审计报出（not_applicable_for_target_capability）。audit_gate 对报告字段做纯函数，报出全部十四条命中（established_right_without_basis/undeclared_component/precision_without_fp32_baseline/int8_without_calibration/cuda_ep_registered_without_placement/full_gpu_claimed_without_placement_records/full_gpu_claimed_with_cpu_fallback/scenario_passed_without_evidence/gates_evaluated_without_model/fallback_claimed_as_acceptance/fallback_without_authorization/fallback_outside_sentence_boundary/fallback_unlogged/not_applicable_for_target_capability）；落 nai-kernel（只依赖 contracts，18 包与依赖方向不变），复用 metrics::LatencySamples 与 golden::Finding（后者 Finding::new 提升为 pub），见 tests/realistic.rs 37 项。不新增 xtask 命令与证据目录（§30.1 只为 RAG 黄金集指定 tests/rag-golden，为写实 Gate 臆造证据目录属过度绑定；G2 真值来自目标机实测而非仓库载荷）。真实权重与授权文件、Rust/ORT 推理、Windows/CUDA 目标机实测与直播工具并发测量未接。blocked（§655 证据齐全验收未达）"}
  - {id: "B03", title: "成本对账", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-10-w19-provider-substitution.md", notes: "usage ledger 已实现；两家协议的用量字段名（Anthropic input_tokens/output_tokens、OpenAI prompt_tokens/completion_tokens/total_tokens）均映射进同一封闭单位表并按 provider_ref 入账；ElevenLabs 用响应头 x-character-count、缺失时用发出文本的确定性字符数；OpenAI 兼容 TTS 不报 usage 则不编造（actual 为空）；账单异步对账待接"}
  - {id: "B04", title: "整链路延迟分位", release_line: r2, automation: manual, status: implemented, evidence: "reports/2026-10-10-w29-operations-review.md", notes: "整链路分位只从端到端样本算（LatencySamples::percentile），阶段分位各算各的，sum_of_stage_percentiles 仅作具名对照且 stage_sum_gap 显式给出差距——§12.5「不把各阶段 P95 相加」成为两个不同的调用而非约定（否决插值分位与「端到端或阶段之和」开关）；分位用 nearest-rank（ceil(p/100·n)，不插值）故报告返回的必是真实样本、可与原始数据逐条对照；端到端样本少于 MIN_PERCENTILE_SAMPLES=20 以 CAPABILITY_NOT_READY 拒绝（十份样本的 P95 实际上就是最大值）；DESIGN_TARGETS 收录 §12.5 的模板开口 1500ms/API 开口 3000ms/控制响应 50ms（均 P95），evaluate_target 返回 Meets|Exceeds 且样本不足返回 Err 而非达标，恰好等于限值判 Meets；落 nai-kernel，见 tests/metrics.rs。真实设备时延采样未接，保持 implemented 不标 tested"}
  - {id: "B05", title: "真人接管音轨与回声", release_line: r1, automation: manual, status: implemented, evidence: "reports/2026-10-10-w28-talent-takeover.md", notes: "接管一次做完四件：暂停自动、TTS 轨静音、清空自动队列（清空条数作为报告值 TakeoverReport::cleared_utterances 而非断言）、可选接入真人轨；两轨互斥由 AudioMixer::render 从模式推导静音轨，故 {tts>0,talent>0} 没有构造点（否决两个增益 setter + 调用约定）；CaptureRegistry 只允许一条有效收音路径（acquire 不看 owner/device 一律 CONFLICT，正是 OBS 与伴侣重复收音场景），release 只接受当前代次（旧租约 STALE_EPOCH，故迟到释放掐不掉新持有者）；DeviceId 为稳定不透明标识，observe_default 把默认设备变化报成 Changed{from,to} 并记住而不静默跟随；接管要求新鲜通过的回声测试（Unrun/Running/Failed→CAPABILITY_NOT_READY，过期→EVIDENCE_EXPIRED，未来时刻无效，TTL 5 分钟）；resume_auto 每次复核授权+事实版本（与接管快照一致）+值守租约（未到期），on_talent_silence 只读返回当前模式故「不因真人讲话结束而自动恢复」在 API 上不可表达（否决定时器与 ResumeHint）；audit_mix 对上报快照做纯函数，六类稳定标记（both_tracks_audible/takeover_with_tts_audible/auto_with_talent_audible/takeover_without_capture_path/takeover_without_valid_echo_test/multiple_live_capture_paths）全部可构造；落 nai-media-core（media 层，18 包与依赖方向不变，仍无 HTTP 客户端），见 tests/mixing.rs 18 项。真实声卡、真实 OBS/伴侣回声环境与真实设备默认变化未接入，保持 implemented 不标 tested"}
  - {id: "B06", title: "场次复盘报告", release_line: r1, automation: manual, status: implemented, evidence: "reports/2026-10-10-w29-operations-review.md", notes: "报告 SessionReview::build 从调用方计数投影，覆盖 §5.9 末条全部字段：互动量与入选率、回答覆盖率、批准/修改/拒答比例与原因、延迟分位（复用 B04 的聚合器，一个真相）、故障与降级事件、成本与预算、守门命中分类（§5.4 四阶段 input/evidence/output/preplay × 四结果 pass/rewrite/block/escalate，is_hit 只计非通过）；构造即自洽（入选≤互动、回答≤入选、批准/修改/拒答之和≤入选、拒答必须被原因完全解释，否则 INVALID_ARGUMENT）；Ratio 保留分子分母（permille 在分母为零时返回 None）故报告可被复核；缺测进 unmeasured 清单且字段留空而非写 0，未定价成本为 CostView::Unknown 而非 ¥0；audit_review 对公开报告值做纯函数并报出全部十条稳定标记（比 build 校验更广，作为最后防线，且全部可构造）；落 nai-kernel，见 tests/review.rs 8 项。真实场次数据与报告 UI 未接，保持 implemented 不标 tested"}
  - {id: "B07", title: "基础讲品循环", release_line: r1, automation: integration, status: pending, notes: "【本轮落点（W68）】本项此前**不存在**：V3.9 §53 把「基础讲品循环」写进 R1 的**定义句**（§14.1 档位矩阵、§56 的「R1 = Lite」行、§2324 定义段「R1 = 单机、单会话、2D、LLM/TTS API、本地知识、基础讲品循环、…」），并自称「为什么这是本版最重要的一条」——但 §48.5 的家族索引写「B | B01–B06」、§57.3 的 R1 清单里**没有任何以讲品循环为对象的条目**，全仓检索「讲品／段落编排／插问／节目／讲解／商品／卖点／售后」在 registry 的命中数**均为 0** ⇒ **R1 的门槛定义里有它、验收清单里没有它**，「讲品循环做完了没」至今不可判真伪（与 W54 之前的桌面壳、W55 之前的平台维度同类）。W68 交出 crates/nai-kernel/src/evaluate/selling.rs（纯逻辑、零新增依赖、零新增契约名、只依赖 contracts）＋ openspec/specs/basic-selling-loop（四条需求）＋ tests/selling.rs（19 项，含五组注入验证）。**四项判定**（§53 明说这四项是「确定性脚本与规则，不依赖工具规划」，故 INV-33 不被触碰）：①**段落编排**——四段与顺序（卖点→规格→适用场景→售后说明）逐项照抄 §53；未定义段名、缺段（**指名**缺哪些、不只报数量）、乱序各自具名；判**序列**不判集合（排序后比较集合的实现会放行错序，注入已验证）；「缺段」与「乱序」同时成立时**两条都报**。②**插问后归位**——检查点只允许「所指段落 + 已完成句引用」；`carried_text` 非空即拒（该字段是为使「带了未播出文本」**可构造**而设——缺了它该违规在类型上无法表达，守卫会恒真）；恢复位置必须**落在检查点所指段落**。③**段落级冷却与最小切换间隔**——两条**分开**判定（同段重复进入 vs 任意相邻两次进入），阈值由 PitchPolicy 给定、模块**不内建**（§48.7：三项阈值待本场景回放实测，MUST NOT 采外部观察值；§5.3 的数字明确是「场景策略初值，不是固定标准」）；进入时刻序列须非降序，前置条件失败**具名**且区间规则不再评估（间隔在递减序列上无定义，直接相减会下溢——注入已验证）。④**事实约束的行动提示**——§45.3 禁用域五类（价格／库存／优惠与活动条件／承诺与售后政策／个体化承诺）逐项写死；「无绑定」与「引用非**当前有效版本**」**分开**具名（只校验「引用非空」的实现会让三天前的价格通过；守卫样本取**同 object、不同 revision**，注入已验证——改用不同 object 的样本会让坏实现通过）。**未升级（为何是 pending 而非 implemented）**：交付的是**判定面**；段落内容与话术、TTS 时长与回放采样是内容创作与运行时的事，§5.7 的「恢复前重新校验产品、价格、活动、素材与授权」由守门与知识层执行 ⇒ 报告 MUST NOT 称「讲品循环已可运行／已可恢复」。**基线偏差（如实登记，不掩盖）**：V3.9 §48.5 的「B | B01–B06」与 §57.3 的计数行「slice_0 10 + r1 36 + r2 9 + capability_pack 29 + r3 1 + experimental 2 = 87（本版只改归属，不加条目）」在新增 B07 后**不再等于实际值**；本轮**不改基线文本**（改基线是升基线轮次的事，且 MUST 是 1:1 行替换），偏差在报告与活文档登记，留待下一轮升基线一并收录——与 W54 新增 A12、W55 新增 A13 的处置一致。**W71 已收录（本项基线偏差闭环）**：V3.10 §48.5 的家族索引改为「B | B01–B07 | 第 16 章、53」，§57.3 的计数行改为 `r1` **37**、合计 **88**（V3.10 §58.2 的 E1–E3）。见 openspec/changes/archive/2026-10-12-w68-basic-selling-loop/、docs/reports/2026-10-12-w68-basic-selling-loop.md"}
  # O 系列：易用性与运营
  - {id: "O01", title: "10 分钟首句演练", release_line: r1, automation: manual, status: pending, notes: "演示包未建（**判定机制** W49 已交付，见下）。W36 起真实语音链路已打通：经本栈（ProviderProfile→ProviderClient→适配器→预算网关）对真实端点合成成功并落真值音频（docs/reports/evidence/），端点级冒烟返回 audio/mpeg 非空字节；但约 10 分钟首句演练语音与约 30 分钟真实输出验证仍需人工执行。**W49 交付判定机制**：crates/nai-kernel/src/demo.rs 把 §615 演示包五要素（**授权的**演示形象/示例知识/示例场景/Provider 预设/一键连通测试与成本预估）与 §612 两条时间目标落成 audit_demo_package（**十六条**稳定标记）+ DemoReadiness 三态：未声明或已声明但未演练 ⇒ Blocked（尚未交付不是违规），审计非空 ⇒ Defective 且**优先**（违规不得因子项未演练而被读成 Blocked），齐备、诚实且已在目标内演练 ⇒ Ready。口径要点：「授权的」是**要求**而非形容词（有形象而无授权引用是缺陷）；Provider 预设只携带凭据引用，内嵌明文密钥即违规（S07）；**连通不等于达标**（常量桩与把冒烟当验收各报一条）；未知成本分项须**说明原因**（未知 ≠ 0）；演练记录的时间戳早于安装就绪是**不自洽**而非「跑得快」。tests/demo.rs 19 项，含「一组构造描述的审计并集**恰为**这十六条」断言；零新增依赖、零 xtask 命令与证据目录（§30.1 未为演示包指定目录）。O01 保持 pending——**授权的形象内容、示例知识与场景正文、一键连通的真实接线与本机人工演练仍为外部**，判定机制不替代真值。见 reports/2026-10-11-w49-o01-o05-in-repo-closeout.md、docs/demo-package.md、docs/adr/0044-demo-package-readiness-boundary.md"}
  - {id: "O02", title: "高危命令确认与审批上限", release_line: r1, automation: ui, status: pending, evidence: "reports/2026-10-11-w51-approval-final-text.md", notes: "API与存储200待审批候选/256命令上限已实测；引擎已托管真实审批后端（approval.read/write经共享装配），见reports/2026-10-09-engine-assembly.md；UI验收保持pending。W38 补上桌面审批面并首次建立 §30.1 指定的 UI 层（tests/ui，15 项）：待审批面板（候选哈希/状态/证据计数/有效期/200 上限提示）、批准的两步二次确认（首次点击只置位、第二次才提交；拒绝是安全方向故单步）、动作前新鲜度复核（会话换代/已不在队列/无有效期/已过期 ⇒ **不发请求**并具名理由，判据 approvalFreshness 与编排 runApprovalDecision 在 tests/ui/approval-surface.test.mjs 被断言）。命令 ACK 口径不变：describeCommandResult 对静音/接管/批准一律写明「控制 ACK 非硬件 ACK」。**W51 补齐「审批按钮显示最终文本」（§662/§425）的逻辑面**：存储迁移 0006-utterance-display-text.sql 新增 utterances.display_text（DEFAULT ''，只增不改——verify() 逐文件 SHA-256，改 0001 会令既有库校验和漂移），record_candidate 写入候选自身 display_text，list_pending_approvals/read_approval 返回该列；控制面载荷新增 display_text，契约 ResourceItem 增**可选**字段（可选准确表达「可能没有」，必填会让旧行缺文本不可表示），三份生成物随之重建；桌面 console.ts 的 candidateText/approveConfirmPrompt 显示文本并**点名身份为候选哈希**（tests/ui/approval-surface.test.mjs 断言 label!=='' 且 text!==id）。**口径**：文本是**只读呈现**，身份**始终是候选哈希**、命令也以哈希为准；缺文本（DEFAULT ''＝早于 0006 的旧行）**具名缺口**（FINAL_TEXT_GAP）而非用空串冒充；display_text 在哈希覆盖范围内（candidate_hash 对整个 cue 含该列做 SHA-256）但存储只留哈希与文本两列、**无法**由文本重算哈希本地核对 ⇒ **不声称「文本已被哈希校验」**，文本被篡改不会让审批绑定到另一候选、但**可能误导操作员**（**剩余风险**，ADR 0045）。§30.1 四条 UI 断言中「模式切换条件」（缺 POST /sessions/{id}/mode 实现，契约见 schemas/openapi/control.yaml:66）与「升级与回滚提示」（缺 nai-upgrade-core 的 plan/journal 状态来源）被登记为未实现并**点名缺失前置**，不伪造已覆盖。**不测渲染**（未引入 DOM 库，故不构成浏览器或人工 UI 验收）；**真实候选来源、证据详情页、手机审核、生产 root 接线与 local_control 的审批装配仍未建** ⇒ **O02 保持 `pending`（存储/契约/界面出现不等于验收达标，按 admission-registry 的诚实回填不得自动升级）**。见 reports/2026-10-11-w51-approval-final-text.md、docs/adr/0045-approval-display-text-boundary.md、docs/ui.md、docs/control.md。"}
  - {id: "O03", title: "手机监控包", release_line: r1, automation: manual, status: blocked, notes: "【口径】规格 §663 的 O03 验收是「路线 A/B 定案；最小形态（看板、审批、接管、紧急静音）通过 S09」＝外部 M0b PoC 定案 + 真机集成；M0b 未做、移动端应用（PWA 或原生壳）、证书、分发、中继与真机 S09 集成均未建，故为 blocked（原 notes 仅记「Blocked 原因待 registry 标注」，此处补齐原因）。本项已交付的是判定机制（W33）。判定机制：§3.1 L5「只发命令、看状态，不持有媒体时钟与密钥」落成白名单投影而非黑名单——MobileView 结构上只含十个白名单字段（mode/current_utterance/pending_seconds/event_source/api_status/budget_status/device_status/pending_approvals/alerts/enable_status），LiveState 的 media_clock/secret/raw_audio/raw_video/broadcast_control 在它之上没有落脚处；MobileView::field_names() 与 Exposure::ALLOWED 的标签集合被断言相等（给视图加字段而漏登记即测试失败），LiveState::sensitive_field_names() 与投影字段集合被断言不相交（否决事后剔除：给 LiveState 加字段就会默认流出），Exposure::ALL 为 ALLOWED 与 FORBIDDEN 之并且互不相交。最小形态是四项清单（MobileCapability::MINIMUM_FORM＝看板/审批/接管/紧急静音），缺项逐条指名（minimum_form_incomplete），预览与推送后置不算缺陷（§10.2「预览与推送可后置」）。「它不是手机开播」（§10.2）与「手机只做监控管理」（§742）落成禁止暴露类别 BroadcastControl（exposes_broadcast_control），与媒体时钟（exposes_media_clock）、密钥（exposes_secret）、原始音视频（exposes_raw_media）同族。预览四条件仅在 enabled 时受检（按需 on_demand、真正编码的低码率 truly_encoded_low_bitrate、关闭立即释放编码器与带宽 releases_encoder_and_bandwidth_on_close、不得挤占正式出画 may_preempt_official_output 为假），未启用时一律不产生缺陷（否决把「不适用」读成「不合规」）。中继终止 TLS 不得宣称端到端（§10.2）：relay_terminates_tls 且 claims_end_to_end ⇒ e2e_encryption_claimed_with_relay_terminated_tls、宣称 E2E 而协议未审核 ⇒ e2e_encryption_claimed_without_reviewed_protocol，如实披露中继可读而不宣称 E2E 不算缺陷（与 W32「不以 CUDA EP 注册宣称全 GPU」同形）。路线 A/B 前置逐条：A 缺有效 HTTPS 域名或证书 ⇒ relay_pwa_without_secure_context（PWA Service Worker 需安全上下文）、B 缺应用分发 ⇒ native_shell_without_distribution、Tauri 2 成熟度未验证 ⇒ native_shell_tauri_maturity_unverified。readiness 三态且 Defective 优先——审计非空 ⇒ Defective、否则路线 Undecided ⇒ AwaitingRouteDecision（未定案是诚实状态而非缺陷）、已声明路线且无违规 ⇒ Ready（否决未定案即缺陷或即就绪，也否决未定案掩盖越界）。远程命令按 §86 INV-14 与 §636 S09 判字段齐备（身份、会话与 epoch、序号、TTL、实际 ACK，缺项 ⇒ command_contract_incomplete 并指名命令）与最低角色（高危命令开放给观察者 ⇒ high_risk_command_open_to_observer 并指名）；真实防重放/去重/ACK 与吊销即时生效属 S09 集成验收，不在本模块。运营项：紧急静音不可达 ⇒ emergency_mute_unreachable（§10.2 最小形态、§37.3 紧急停用）、未提供启用状态 ⇒ enable_status_missing（§37.3）、知识速补未接审核发布流程 ⇒ knowledge_patch_without_review_flow（仅在声明 KnowledgePatch 能力时判）。audit_surface 是描述符的纯函数，十九条稳定标记逐条可构造并以「恰为这十九条」断言防止未登记的额外标记；落 nai-kernel（只依赖 contracts，18 包与依赖方向不变，零新增依赖），复用 golden::Finding，见 tests/monitoring.rs 34 项与 reports/2026-10-10-w33-mobile-monitoring-surface.md。不新增 xtask 命令与证据目录（§30.1 为 UI 层指定 tests/ui、为 RAG 黄金集指定 tests/rag-golden；手机监控面真值来自真机与 M0b PoC 而非仓库载荷，臆造 tests/mobile-monitoring 属过度绑定）。M0b 路线定案、移动端应用与证书/分发、中继、真机最小形态 S09 集成与证据载荷落点未接。blocked（§663 外部定案与真机集成未达）"}
  - {id: "O04", title: "安装与设备", release_line: r1, automation: manual, status: blocked, notes: "【口径】规格 §1329 的 O04 验收是「干净 Windows 安装且运行库可取得；音频设备变更不重复收音；升级可回退」＝受控 Windows 机器 + 真实音频设备 + 真实回退演练，均为外部真值，Windows 安装未执行，故为 blocked。本项已交付的是**设备侧**判定机制（W34）；**安装侧已另有落点**——运行库/平台/依赖闭包/磁盘/凭据由 nai-upgrade-core 的 manifest+preflight 覆盖，回退由 plan(journal/RollbackReport/RecoveryAction)+gates(require_rollback_compatible/downgrade) 覆盖。判定机制：§34.4/§1469/§35.3/INV-23/§8.5 落成 kernel::device 的 audit_host 纯函数（**十六条**稳定标记）——设备能力靠声明（动作枚举/取值范围/速率限制，缺项指名设备与动作）；执行类必须安全联锁+本地手动覆盖，纯 Sense 不适用（否决把不适用读成不合规）；物理执行类推导 risk_3、默认禁用、需本地确认与独立开关（Sense 标注物理执行为分类错误）；有效风险=max(声明,推导)，声明低于推导即拒（§35.3「上架审核与加载时都拒绝」）；驱动与 SDK 不进内核进程（DeviceHostPlacement，声明即违规，是独立声明故不受是否有设备门控）；热插拔/断线/重复/超时四类事件各有处置且写决策日志（无设备声明时不存在设备事件，故条件化）；重复音频设备不得打开第二条有效收音路径（duplicate_event_opens_second_capture_path，即「音频设备变更不重复收音」）；实际使用不得超出声明与用户授权（INV-23，宿主强制执行、不靠自觉），未声明只报一次不重复报越权；readiness 三态 Blocked/Defective/Ready 且**先取审计**（Defective 优先，Blocked 的判据是审计为空且无声明）。**不新增 xtask 命令与证据目录**（§30.1 为升级/RAG/UI 指定 tests/upgrade、tests/rag-golden、tests/ui，未为设备接入指定目录；真值来自受控 Windows 机器与真实设备而非仓库载荷）。见 reports/2026-10-10-w34-device-admission.md、docs/device-admission.md、docs/adr/0036-device-admission-boundary.md。"}
  - {id: "O05", title: "升级成本显示", release_line: r1, automation: ui, status: pending, evidence: "reports/2026-10-10-w15-upgrade-core.md", notes: "成本逐项模型已实现且可测（CostEstimate：cloud/download/storage/runtime_delta 分项为 Known 或 Unknown，未知不冒充 0；total 全已知为 Complete，否则 Partial 下界+未知计数，tests/gates.rs）。**W49 补上呈现层**：apps/desktop/src/upgrade.ts（零 DOM，与 console.ts 同形）把「准确列示」落成可断言口径——costRows 把未知分项呈现为**原因**（绝不呈现为 0；显式的 0 是一个断言，被如实呈现为 0），totalPresentation 在全已知时给合计、含未知时给**下界+未知计数**并明说**不是**总额，parseCostEstimate 对缺字段/未知字段/非法金额/空原因共十条用例**具名拒绝**（不静默补 0、不猜补）；tests/ui/upgrade-cost.test.mjs 19 项。**未满足项**：控制面尚未暴露 nai-upgrade-core 的 plan 与成本来源（与 §30.1 第 4 条「升级与回滚提示」**同一缺失前置**），故该模块**未接入任何界面**，真实升级 UI 渲染与生产接线未做；tests/ui 证明的是**呈现口径**，不构成 O05 的完整 UI 验收。UI 验收保持 pending（同 O02 惯例；**不因呈现层出现而升级**）。见 reports/2026-10-11-w49-o01-o05-in-repo-closeout.md、docs/ui.md"}
