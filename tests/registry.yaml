  - {id: "S11", title: "IPC 模糊与路径穿越", release_line: r1, contract: "plugin-hosts-and-ipc", automation: unit, status: tested, evidence: "reports/2026-10-11-w39-ipc-untrusted-input.md", notes: "帧/握手/路径定向测试通过（D05）。**W39 补上验收名中「模糊」这一半并修正登记口径**：此前 status 已是 tested 而 notes 自记「模糊测试待建」——验收名含「模糊」却未实现，属登记与事实不一致。现落 crates/nai-plugin-hosts/tests/untrusted_input.rs（确定性种子随机输入测试，8 项）：断言**全域性与有界性**（任意字节 ⇒ Ok 或具名 ErrorCode、不 panic、不按输入无界分配；超长长度前缀在分配前拒；撤销/期限先于内容解释），并带**非空洞性守卫**（每类语料实际命中的形状与错误码计数为零即测试失败），守卫做过**反向自检**（阈值调高到不可能命中时测试确实失败）。实测命中计数（固定种子）：帧流 bodies=683/clean_eof=179/oversized=1982/truncated=1935；结构化 Envelope invocation_decoded=1569/version_incompatible=601/invalid_argument=846/denied_or_absent=225/completed=185/cancel_acks=191；路径 rejected=1927/accepted=121/traversal_rejected=651。**口径与边界**：这不是覆盖率导向模糊测试（无 cargo-fuzz/libFuzzer、无 nightly、零新增依赖），一律称「随机输入测试」；阴性结果不是安全证明，**未发现缺陷 ≠ 不存在缺陷**。顺带纠正一处易读错语义：**ACL 拒绝与能力缺失是 result 级错误（写回对端）而非连接级错误**——dispatch 写完 CapabilityResult{end:StreamError} 后返回 Ok，故 serve 返回 Ok 不代表放行，只看返回值会把 225 次拒绝误计为成功；harness 因此解析宿主写出的帧（并断言宿主只输出良构帧）。见 reports/2026-10-11-w39-ipc-untrusted-input.md、docs/hosts.md。真实命名管道/Unix socket 对端身份（SO_PEERCRED 在钉住 rustc 上仍不稳定）、Windows Named Pipe peer PID、AppContainer/Job Object 仍未测（Blocked）"}
