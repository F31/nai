  - {id: "H16", title: "harness 黄金集：装配、拒识、工具失败、缓存误命中、描述漂移、越权委派六类各有回放用例", release_line: capability_pack, automation: unit, status: pending, notes: "【V3.11 §51.3（V3.9 收缩：自 r2 降为能力包）；INV-33/34】未开始（W64，V3.11 §47.2、§48.5）。黄金集复用 §5.9 既有机制，不新增契约，故 contract 留空；automation 为规划意图"}
  - {id: "H17", title: "逐层具名降级：每层失败落到 §12.2 降级顺序并在界面可见，无静默降级", release_line: r1, automation: fault, status: pending, notes: "W66 已落判定面：harness.rs 把 §47.4 六类失败各映射到 §12.2 四级之一（首选级起沿序回退、静音待机兜底），错误码互异且恒可见；INV-32 后半段由 assert_no_free_form 判『降级后失去策略/人设约束』为违规。**仍未接线**——渲染进 CapabilityView 与界面属呈现层工作，故 status 保持 pending。**【W132（本轮落点）】补上 runtime 接线**：开工前现测 `evaluate_degradation` 与 `assert_no_free_form` 在 crates/ 与 apps/ 里**只被测试引用**（生产零调用点），且 `DegradeVerdict::visible` 是**恒为 `true` 的构造常量**——判定面没有「不可见」这一格，故「无静默降级」钉在判定面**恒绿、是装饰**；真正会坏的是判定到界面的 **transport**，本轮交付的正是它。①呈现层承载物（`crates/nai-kernel/src/evaluate/harness.rs`）：`DegradationNotice` + `render_degradation_notices`——一条判定渲染成**恰好一条**通知、**不去重不合并**、字段**照抄**判定输出、六层可行动说明互异；②承载物：`DecisionKind::Degradation`（判 **critical**：telemetry 写失败会落遥测缓冲 ⇒ 悄悄消失的降级正是静默降级）+ 迁移 `0011-decision-log-degradation-kind.sql`（逐列重建、逐字复制含四个哈希列）+ 版本号成套六处 10→11；③接线（`crates/nai-runtime/src/degradation.rs`）：`Composition::record_degradation` 入参是**事实**（哪些层失败／还剩什么可用／上下文还留着什么）而非判定结果，在生产路径上**真调用** `evaluate_degradation` 与 `assert_no_free_form`，判定**先于写入**、违规**零落盘**；`Composition::read_degradation_view` **只从链上解码**（不可解析 ⇒ 具名失败不静默跳过、空链报 `0`、域＝`degradation` 那一种）。判据：kernel **29/29**（**24+5** 新——现测 `HEAD` 的 `tests/harness.rs` 里 `#[test]` 计数为 **24** ⇒ 本轮新增**五**条，此前误记为四条已订正）、runtime **9/9**（新文件）、`nai-storage --lib` **82/82**（81+1 迁移，`RUST_TEST_THREADS=4`）、`schema.test.mjs` **30/30**、`registry.test.mjs` **56/56**；全量门控 Rust **1073/0**（W131 为 1058 ⇒ **+15 == 5+9+1**，逐项吻合）；**9 条注入、8 条真红**。⚠️ **R2 注入首跑假绿**（写成 `!cfg!(test)` 时全绿——`cfg!(test)` 在**生产 lib** 里恒 false，注入没改行为）⇒ 「注入不变红」除「被短路」「无覆盖」外还有**第三种成因：注入自身坏了**，MUST 先怀疑注入。**K4 再实证 ADR 0109**：写「首选级」而非「回退后的级」的坏实现让 kernel 29/29 与 runtime 既有 8 条**全绿**（它们全用 `all_available()`，两种写法在该输入下构造性相等），**只有本轮新补的回退用例红**。**刻意不做**：不扩展 `CapabilityView` 契约——`CapabilityDescriptor` 描述**插件能力**，把层失败映射进去需编造 `capability_id`/`plugin_id` 且 `PluginState` 无对应取值，那是在说「一个插件失败了」而事实是「某一层失败了」；且改 proto 需 protoc 3.21.12（本机无）。⇒ **验收仍 `pending`**：四环里 ①判定面（W66）②执行体（本轮）已建且有覆盖，但 **③调用方（呈现层渲染）与 ④真实产生者（真实界面）未接线**，本轮交付的是「降级项清单**存在且可被界面读到**」，不是「界面已经显示了它」。见 docs/adr/0110-degradation-visible.md、docs/reports/2026-10-17-w132-degradation-visible.md。V3.11 §47.4、§48.5"}
  - {id: "H18", title: "爬坡门控：harness 新机制默认只在演练、影子与人工辅助启用，进自动前须过回归", release_line: r1, automation: manual, status: pending, notes: "W67 已落判定面：crates/nai-kernel/src/evaluate/ramp.rs 判四段爬坡（演练→影子→人工辅助→受监督自动）与晋升到受监督自动的两条条件（§47.2 六类回归已声明受影响范围且全部通过、且绑定当前 harness 修订；启用记录指名同一机制与目标阶段、值内无凭据），13 项测试含五组非空洞守卫。**仍未接线**——按阶段真正启用机制、把记录追加进哈希链是 runtime 工作，六类回归的执行体是能力包 H16，故 status 保持 pending（沿用 W57/W66 口径）。**该「基线待确认项」已由 W71 裁定（E4：与阶段枚举解耦）**：默认启用集合现按 §5.9 爬坡中的**位置**判据表述（「受监督自动以外」），不再枚举阶段名 ⇒ 影子在 R1 内**只是不存在**，MUST NOT 为对齐枚举而新增该阶段；契约 `SessionMode` 仍只有三个取值（对 `Shadow` 返回 `None`，由测试钉死），§1.4/§17.3 把影子列在 R2 不变。见 V3.10 §58.2 的 E4、§58.4。本项**仍为 `pending`**——只消除了文本不对称，未宣称达标。**W105 已补 runtime 接线**：`crates/nai-runtime/src/ramp.rs` 的 `record_promotion` 把判定**放行**的启用记录落成 `approval` 类条目（critical 级 ⇒ 写入失败原样上报、不静默进缓冲）、**拒绝**一字节不落盘（具名拒绝 + 全部缺失类别 + 凭据字段名）、**目标阶段在门控之前**报 `NoRecordRequired`（非拒绝、不追加）；载荷恰为 `mechanism`/`from`/`to`/`fields` 四项且不夹带 `req.touched`/`req.passed`；**零迁移零契约改动**（复用既有的 `approval` 种类，它在枚举与 `0005` 的 `kind CHECK` 两个闭世界里都已存在）。9 项运行期测试含遍历 `RampRejection::ALL` 八条的非空洞守卫 + 五组非空洞注入（4/2/2/1/5 红）。**status 仍 `pending`**——按阶段真正启用机制的机制侧与 §47.2 六类回归的执行体（H16，能力包）未接线。V3.11 §47.3、§48.5"}
