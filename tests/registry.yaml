  - {id: "H03", title: "记忆写入门槛：工具返回、评论原文、模型草稿不得写成事实或承诺", release_line: r1, contract: "memory.access@1", automation: unit, status: pending, evidence: "reports/2026-10-11-w57-memory-read-write-surface.md", notes: "【W57 落点：判定机制已交付，验收保持 pending】既有 crates/nai-kernel/src/evaluate/memory.rs 覆盖的是 V3.5 §23.5 的**子集**（working_memory 按 played_ids 过滤、session_summary 确定性去重、viewer_record_allowed 默认关闭），**没有「写入来源」这一维**——工具返回、外部智能体返回、评论原文与模型草稿与正常内容不可区分，§42.2 的来源门槛、必填项（作用域/来源标识/时间）与「叙述/权威事实」标注在仓库里零落点。W57 **只增不改**地补上：WriteSource（approved_played／approved_unplayed／tool_return／peer_return／comment_text／model_draft）、ClaimKind（叙述/权威事实）、MemoryCandidate 与 admit_write。判据每条对应一个具名拒绝：不可信来源一律不得写成事实或承诺（**不按 claim 放行**）⇒ untrusted_source_as_fact；已批准未播出 ⇒ unplayed_candidate_as_fact；缺作用域 ⇒ write_without_scope；缺来源标识 ⇒ write_without_source_ref；缺时间 ⇒ write_without_timestamp；权威事实缺 §6 发布引用 ⇒ fact_without_publish_ref；权威事实落在非语义记忆 ⇒ fact_outside_semantic_memory。测试 crates/nai-kernel/tests/memory.rs（**21 项**，新增第 **69** 个测试目标）含「拒绝名并集**恰为 23 条**」总账断言、以及正向不变量（合规候选零拒绝——否则「全都拒」也能让测试变绿）。**为何仍是 pending**：判据描述的是**运行时行为**，而真实记忆子系统不存在——无持久化、无控制面接线、无 Pro 跨会话（§42.5 本轮未覆盖）。沿用 A12（桌面壳边界）／O01（演示包判定机制）／O05（呈现层）与 W32–W36 判定骨架轮的先例：**机制交付 ≠ 验收达标**。见 docs/reports/2026-10-11-w57-memory-read-write-surface.md、docs/kernel.md、openspec/changes/archive/2026-10-11-w57-memory-read-write-surface/"}
  - {id: "H04", title: "记忆读取与作用域：跨作用域读取被拒；观众长期记忆默认关闭", release_line: r1, contract: "memory.access@1", automation: unit, status: pending, evidence: "reports/2026-10-11-w57-memory-read-write-surface.md", notes: "【W57 落点：判定机制已交付，验收保持 pending】§42.3 的关键词是**顺序**（先作用域、再时效）与**不得静默**（不得用近似条目顶替），既有代码**没有读取路径**（只有 viewer_record 的字段级校验）⇒ 作用域过滤、撤销、权限、近似顶替、配额裁剪全部零落点。W57 补上 MemoryScope／MemoryQuery／ScopedRecord／MemoryReadOutcome／read_records：**请求级**拒绝有 invalid_scope（作用域不完整，不得就近匹配）、viewer_memory_disabled（默认关闭）、viewer_read_without_authorization、viewer_read_without_purpose、approximate_substitution_requested（把「不许顶替」写成**可被拒绝的请求**而非注释）；**条目级**拒绝写进 refused 并**逐条具名**——out_of_scope／expired／revoked／permission_denied／approximate_substitution／over_budget。**裁剪可见**是刻意的：被裁条目必须具名，否则「被裁掉」与「本来就没有」无法区分（同 §44 对工具循环的「无静默截断」）。超配额按「**场次 > 工作 > 观众长期记忆**」的固定优先级裁剪（保留原序，不重排）。观众长期记忆需授权引用 + 用途记录，缺任一项以「无记忆」继续且不写画像。测试 crates/nai-kernel/tests/memory.rs 21 项，含**顺序断言**（同时越作用域又过期、又撤销、又无权限、又是顶替条目的记录，报的是 out_of_scope ⇒ 证明「先作用域后时效」不是注释）与优先级非空洞守卫（budget=2 时保 s1/w1、裁 v1/w2；若按输入序取前二则会得到 w1/v1 ⇒ 该用例能区分「按优先级」与「按顺序」）。**为何仍是 pending**：同 H03——读取面是纯判定函数，真实记忆子系统与生产接线未建。见 docs/reports/2026-10-11-w57-memory-read-write-surface.md、docs/kernel.md、openspec/changes/archive/2026-10-11-w57-memory-read-write-surface/"}
