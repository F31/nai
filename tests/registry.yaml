  - {id: "A02", title: "仅改配置换 Provider", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-10-w19-provider-substitution.md", notes: "第二家替换测试已建：同一调用函数（generate_once/speak_once）分别对 OpenAI兼容/Anthropic（文本）与 OpenAI兼容/ElevenLabs（语音），二者只差一个 ProviderProfile；线上差异（路径、凭据头名、请求体形状、voice 在体内/路径内）被实测到以防假通过；凭据形态与静态头由 Protocol 派生，能力不符显式报错；provider-core 36 项通过，见reports/2026-10-10-w19-provider-substitution.md。真实付费账号无余额、真实 TTS 设备未接，保持 implemented 不升级。W36 起第二家真实端点已按同一绑定接缝实测（见 reports/2026-10-10-w36-live-provider-evidence.md）：两家真实网关各只差一份 ProviderProfile，Protocol 枚举与适配器集合零改动。W37 修正了 W19 对照表中「请求体角色」一项：`messages[0].role` 的 system/user 之别**并非供应商差异，而是内部不一致**——真实网关证明 system-only 不被普遍合法（严格网关 400 No user query found in messages），已把 openai 适配器改为与 anthropic 一致的 `user` 轮；差异仍在（路径、stream_options、凭据头、用量字段名）但不含角色，见 reports/2026-10-10-w37-provider-message-turn.md、docs/adr/0039-provider-message-turn.md。"}
