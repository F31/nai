  - {id: "R10", title: "开播与回滚不丢写入", release_line: r1, automation: fault, status: implemented, evidence: "reports/2026-10-10-w15-upgrade-core.md", notes: "暂存与激活分离——开播中只暂存不激活（SessionGate 要求无活动会话，被门控的包不失效，tests/gates.rs）；降档先排空后停用且记录数不变，排空不彻底即停止；目标超 rollback_range 以 VERSION_INCOMPATIBLE 阻止静默回滚；回滚导出升级后事实与审计（ExportedWrites）。真实会话注册表（装配根）未接线，不标 tested"}
  - {id: "R11", title: "离线升级与部署迁移", release_line: r2, automation: fault, status: implemented, evidence: "reports/2026-10-10-w25-tier-idle-migration.md", notes: "离线安装前置「每个声明文件都在本地」，缺件以 CAPABILITY_NOT_READY 拒绝并由 missing_artifacts 指认是哪个文件（与在线路径的 missing package content 可区分），随后复用同一条校验链；「不会偷偷下载」是编译期性质（crate 无 HTTP 客户端，否决 allow_fetch 开关）；部署迁移搬动前拒绝三件事（有活动会话→维护窗口、分布式目标+SQLite 多写者、权限无映射即拒而不静默丢弃），搬动后复验权限集合/证据版本/数据哈希三项且错误码可区分（否决只比哈希）；OutputSwitch 以 key 幂等即输出切换不重复播报，见 tests/migration.rs 11 项。真实轻云实例与真实迁移未执行，不标 tested"}
