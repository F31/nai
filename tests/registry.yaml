  - {id: "H15", title: "harness 观测五类记录进决策日志，且不含明文凭据", release_line: r1, automation: integration, status: pending, notes: "W66 已落判定面：crates/nai-kernel/src/evaluate/harness.rs 判定五类记录能否进日志（必需项齐备、值内无凭据字面量、观众原文已脱敏），24 项测试含四组非空洞守卫；**仍未接线**——真正追加进 nai-storage 的哈希链是 runtime 工作，故 status 保持 pending（沿用 W57 对 H03/H04 的口径）。V3.9 §47.1、§48.5"}
  - {id: "H16", title: "harness 黄金集：装配、拒识、工具失败、缓存误命中、描述漂移、越权委派六类各有回放用例", release_line: capability_pack, automation: unit, status: pending, notes: "【V3.9 §51.3：自 r2 降为能力包；INV-33/34】未开始（W64，V3.9 §47.2、§48.5）。黄金集复用 §5.9 既有机制，不新增契约，故 contract 留空；automation 为规划意图"}
