  - {id: "A02", title: "仅改配置换 Provider", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-10-w19-provider-substitution.md", notes: "第二家替换测试已建：同一调用函数（generate_once/speak_once）分别对 OpenAI兼容/Anthropic（文本）与 OpenAI兼容/ElevenLabs（语音），二者只差一个 ProviderProfile；线上差异（路径、凭据头名、请求体形状、voice 在体内/路径内）被实测到以防假通过；凭据形态与静态头由 Protocol 派生，能力不符显式报错；provider-core 36 项通过，见reports/2026-10-10-w19-provider-substitution.md。真实付费账号无余额、真实 TTS 设备未接，保持 implemented 不升级。W36 起第二家真实端点已按同一绑定接缝实测（见 reports/2026-10-10-w36-live-provider-evidence.md）：两家真实网关各只差一份 ProviderProfile，Protocol 枚举与适配器集合零改动。W37 修正了 W19 对照表中「请求体角色」一项：`messages[0].role` 的 system/user 之别**并非供应商差异，而是内部不一致**——真实网关证明 system-only 不被普遍合法（严格网关 400 No user query found in messages），已把 openai 适配器改为与 anthropic 一致的 `user` 轮；差异仍在（路径、stream_options、凭据头、用量字段名）但不含角色，见 reports/2026-10-10-w37-provider-message-turn.md、docs/adr/0039-provider-message-turn.md。"}
  - {id: "A03", title: "新增连接器不改内核", release_line: r1, automation: integration, status: implemented, evidence: "reports/2026-10-08-d13-platform-ingress.md", notes: "platform 准入已实现（D13：nai-kernel::platform::PlatformLink，判「一个事件能不能进」）。【落点（W53）】本项的命题「新增连接器不改内核」此前**没有主语**——plugins/ 下没有任何平台连接器，apps/ 下也没有 platform-bridge。W53 新建 plugins/platform-unavailable（层 plugin，包名 nai-platform-unavailable），登记快手与视频号两个**显式 Unavailable** 实例（§9.4 同目录、platform_id 互异），接缝在 nai-plugin-sdk::connector（层 sdk，只依赖 contracts；内核不得依赖插件，故接缝必须在内核之外）。A03 的**两个方向现在都由 xtask check-deps 强制**：既有分层规则已禁「内核依赖连接器」，W53 新增禁「**平台连接器依赖内核**」（路径 plugins/platform-* → kernel 层）——接缝充分则无需内核类型，故「加连接器不改内核」是**可判定的结构事实**而非承诺。『不放伪造 SDK』（§17.2）同为结构事实：该包只依赖 nai-contracts 与 nai-plugin-sdk，且 tests/unavailable.rs **读该包自身的 Cargo.toml** 做依赖白名单与 SDK 形态断言（含注入一个 vendor 依赖必须被抓到的自检）。不可用连接器的 §27.1 四项职责由接缝的闸门 `require_available()` 按名失败（CAPABILITY_NOT_READY + details[reason]=UNVERIFIED_EXTERNAL_DEPENDENCY），「返回 Ok 但什么都没做」在接缝里没有表示。**未升级**：真实官方接口、调试版伴侣 PoC 与平台准入决定（§9.3）仍是外部真值，两个平台一律如实记 Unavailable { NoOfficialInterface }，不宣称可上线，故保持 implemented。见 reports/2026-10-11-w53-explicit-unavailable-connector.md"}
