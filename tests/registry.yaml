  - {id: "R06", title: "长播无资源增长", release_line: r2, automation: manual, status: implemented, evidence: "reports/2026-10-10-w29-operations-review.md", notes: "长播判定以窗口为下界（TWO_HOURS/EIGHT_HOURS/RELEASE_CANDIDATE）：样本数不足或跨度小于窗口一律 Insufficient 并如实报出观察到的 span_ms 与样本数，绝不报 Stable（否决「跑 40 分钟也算 2h 测试」的名义标签）；判定比较两个半段的中位数而非首尾两点（末端单个尖峰不误判为增长、起始低值不掩盖上升；否决线性回归斜率与首尾比较），drift_pct 超过 max_drift_pct（默认 10%）即 Growing；SoakSamples::record 要求时间非降序故趋势不能靠重排制造；is_conclusive 区分有无结论；落 nai-kernel（只依赖 contracts，18 包不变），见 tests/metrics.rs 13 项。真实 2h/8h/24h 长播与真实资源采样未做，保持 implemented 不标 tested"}
  - {id: "R07", title: "决策日志哈希链与回放", release_line: slice_0, automation: integration, status: implemented, evidence: "reports/2026-10-08-w02-w03-decision-log-duty-lease.md", notes: "哈希链前置已实测；原子冲刷/遥测FIFO/critical优先修复见reports/2026-10-08-w02-w03-admission-hardening.md；桩Provider回放已在真实engine进程链路实测（哈希链校验通过+同事件同桩重放逐项一致），见reports/2026-10-09-engine-manual-event-pipeline.md；链路终点已延伸到「文本→语音→2D帧→双水位提交→实际播放完成」，PlaybackAck条目进入哈希链且仅完整完成才落该kind，见reports/2026-10-10-engine-text-to-playback-ack.md。仍不标tested：该ACK来自演练软件替身（rehearsal-sink），真实TTS与设备/硬件播放ACK生产端仍缺"}
  - {id: "R08", title: "存储维护有界", release_line: r1, automation: integration, status: tested, evidence: "reports/2026-10-07-d03-storage-and-credentials.md", notes: "WAL/配额逻辑部分覆盖【W124 补覆盖（**维持 implemented**）】本项此前**只有一句「WAL/配额逻辑部分覆盖」**，无任何载体。实测零覆盖的边界：`grep MAX_PAYLOAD_BYTES src/tests.rs` = **0**、快照拒绝 `-wal/-shm/-journal`（源码里的 mutable journal 规则）= **0**、`MAX_BYTES` = **0**（而遥测缓冲 `decision_buffer_stats` 有 9 处，故不是整项未测）。本轮补 2 条判别性判据（`nai-storage` 55→57）：① `the_decision_payload_is_bounded_and_the_refusal_is_named`（半量载荷通过；`cap+overhead` 超界 ⇒ 具名 `RESOURCE_EXHAUSTED`，未被静默截断）；② `a_snapshot_carrying_a_mutable_journal_is_rejected`（三个 sidecar 各注入一次 ⇒ `CONFLICT`，**并带对照**：删除 sidecar 后同一快照可恢复 ⇒ 拒绝可归因于 sidecar 而非坏备份）。为使判据**引用**而非复制上限，`MAX_PAYLOAD_BYTES` 改为 `pub(crate)`（W77 对 `Operation::CEILING` 的同一条规矩）。**【勘误（W125）】**W124 那句「`snapshot::MAX_BYTES`、`publication::{MAX_CHUNKS,MAX_BYTES}`、`knowledge::MAX_CONTENT_BYTES` 仍零覆盖，覆盖仍属部分」**只点了四项，而本项的「有界」是一个名册**；且把 publication/knowledge 两族记成 R08 门槛时**未给口径**（D03 的原始存储边界是「登记的不可变文件**数量/大小/路径受限**」）。名册与口径见 W125。【W125 名册与覆盖（**维持 implemented**）】按「具名拒绝（或具名丢弃计数）」普查 `crates/nai-storage`：约束**单次写入或单份快照/备份可占用资源**的上限共 **19** 项，本轮前**只有 2 项有载体**（决策载荷、遥测缓冲容量），其余 17 项可被抬高或删除而**零测试变红**。本轮覆盖 **8/19**（`nai-storage` 57→63，+6 条判据 = 名册幅度 1 + 边界 5）。要点：(a) 名册**幅度判据**管「上限悄悄变大」，**边界判据**管「闸门还在不在、边界在哪一侧」——分工刻意，因为夹具从常量派生 ⇒ 抬高常量**不会**让边界判据变红；(b) 边界**双侧**（导入内容/分块数、artifact 单份大小：恰在界上必须过、越一字节/一块必须具名拒绝）；(c) `publication` 的上限按**所选文档合计**判定 ⇒ 两份各自合法的文档合起来必须被拒（逐文档测试会判成通过）；(d) 快照读回的两道闸门给出**不同**具名拒绝（`snapshot file limit` 超限 vs `database hash/size mismatch` 同尺寸改字节）⇒ 拒绝可归因；(e) `snapshot::MAX_ARTIFACT` 在**写入**与**读回**两侧同值同界；(f) 为可归因，`publication` 的**合并拒绝**拆成 `snapshot chunk count bound` / `snapshot chunk byte bound` 两条；(g) **稀疏夹具**：`checked_file` 先比 `metadata().len()` 再读 ⇒ `set_len` 造逻辑长度即可到达尺寸闸门（实测 0.39s / 逻辑长度 256MiB+1），W124「256MiB 级夹具代价过高」的推迟理由**由此作废**。**注入验证**：三条独立注入（读回尺寸闸门改 `u64::MAX`／发布两拒绝重新合并／内容界改 `>=`）⇒ 对应判据各自变红且可归因，名册幅度判据与 artifact 写入判据保持绿。**仍不升 `tested`**：名册 19 项**剩余 11 项零覆盖**——① `knowledge` 撤销批次 4096（`revocation revision bound`）、② 快照文档数 256（`invalid snapshot documents`）、③ 托管文件数 512（`snapshot artifact count limit`）、④ 配置文本 65536（`configuration too large`）、⑤ 事实编码 65536（`fact too large`）、⑥ 候选编码 65536/依赖 32（`candidate dependency limit`）、⑦ 待审批容量 200（`session pending approval capacity`）、⑧ 候选证据引用 32（`candidate evidence bound`）、⑨ 账本条目编码 65536（`oversized ledger entry`）、⑩ 已存账本文本 132000（`oversized stored ledger`）、⑪ 十六进制载荷 131072（`invalid stored ledger bytes`）。另有两类**按口径不收**：读路径预算（检索扫描上限以 `truncated`⇒`RetrievalPartial` **报告**而非拒绝）与输入形状校验（id/token/`source_span`/`MAX_TOKENS_PER_CHUNK`/`MAX_DIMENSION`/查询 token 与 `product_filters` 的长度与取值）。见 reports/2026-10-16-w125-storage-bound-roster.md、docs/adr/0103-storage-bound-roster.md。【W129 行为覆盖（**升 `tested`**）】W125 只把名册**当幅度钉住**（常量是不是它自称的那个数），剩 11 项「零覆盖」——「零覆盖」的实测判据是：11 条拒绝名逐条全仓 `grep`，命中数**均为 1**（只有定义处）⇒ 这些闸门可被删掉、改成恒真、或把边界挪一格而**零测试变红**。本轮补齐缺的那一半（**行为**：闸门还在不在、边界在哪一侧）。要点：(a) 提取 **12 个具名常量**（11 项 = 12 条件，因 ⑥ 是两条件一条目）；三条同名数值 `65536`（配置文本／事实编码／候选编码）是**不同的对象** ⇒ 三个常量，共用一个会让「改其中一条」不知不觉改另外两条；(b) 拆 `store.rs` 候选路径的**合并拒绝** ⇒ 新增 `candidate payload limit`（原先并入 `candidate dependency limit`，与 W125 对 `publication` 同一条规矩：一个 `if` 里多条件 MUST 各自举证）——这是本轮**唯一**语义变化（`ErrorCode` 不变）；(c) 两处 SQL 读窗口从上限**派生**（撤销 `LIMIT 4097`→`上限+1`、artifact `LIMIT 513`→`上限+1`），那个 `+1` 就是「后面还有」的检测机制本身；(d) 名册 8→**20 常量（19 项）**，并新增**名册闭世界**判据三层（文件层每个 `mod` 都有被扫源文件／元素层每个**顶格**常量**恰好**归入三类之一且三分是划分／反方向三张清单都扫得到）——谓词按「顶格」而**不是**按可见性筛，否则私有的 `MAX_DIMENSION` 会从后门溜走（首跑该守卫即抓到它自己的作者）。判据 `nai-storage` **63→72**（+8 行为边界 +1 闭世界）；8 条各一对夹具（**恰在界上必须过 / 越界必须具名拒绝**），夹具**从常量派生** ⇒ 抬高常量**不会**让行为判据变红（那是幅度判据的职责）。**注入验证 8 组／17 条真跑**，逐条确认「对应判据变红且**可归因**」，随后**逐字节还原**（末次 `sha256sum -c` 7/7 OK；全量 72 passed/0 failed）；**R1 对照**（只动比较符/窗口、不动常量值）把名册幅度判据**留绿** ⇒ 幅度钉与行为钉分工成立；R5（⑥ 重合并）让**载荷**夹具拿到**依赖**拒绝名 ⇒ 拆名是承重的。**升 `tested`**：名册 **19/19** 同时有幅度钉 + 行为钉 + 闭世界成立；D03 验收原文的「数量/大小/路径受限」由本名册承载（路径侧另有 D03 测试 10 的穿越/symlink 拒绝 + ③ 的路径计数），WAL/事务/备份由 D03 的 12 项存储测试承载；审计对本项只列「名册 11 项零覆盖」一条，现已清空 ⇒ 无剩余缺口（对照 R10：剩余缺口是外部真值 ⇒ 按 ADR 0100 不升）。**如实披露**：⑨ `MAX_LEDGER_ENTRY_BYTES` **今天从被认可的路径走不到**（`nai-budget-core` 把字符串限在 256 字符、`units` 限在 32 键×64 字符 ⇒ 最大合法条目仅几 KB）——已具名登记、设计不上手改，并配一条**会过期**的可达性断言；本名册普查域**限于 `crates/nai-storage`**，域外（如 kernel／budget-core 的输入形状校验）按 W125 口径不收并具名在册。见 reports/2026-10-16-w129-storage-bound-roster-coverage.md、docs/adr/0107-storage-bound-behavior-coverage.md。"}
  - {id: "R09", title: "升级预检与下载失败", release_line: r1, automation: fault, status: implemented, evidence: "reports/2026-10-10-w15-upgrade-core.md", notes: "预检六项（依赖闭包/平台+架构/运行时矩阵/双份磁盘 install+migrated/凭据）三态化，未知与不足同等拒绝且错误码可区分（CAPABILITY_NOT_READY / RESOURCE_EXHAUSTED），失败不触碰当前版本清单（tests/upgrade.rs）；【W126 下载阶段（**维持 implemented**）】W15 记的「真实下载器未实现」经核实更细——本 crate 的每个入口都只**接收**字节（`verify_package(&[PackageFile])`、`install_offline(&[OfflineArtifact])`、`prepare(Vec<PackageFile>)`），没有一处决定「向哪一段要、短读要不要重问、何时放弃」⇒ 断流只能表现为「字节没到」，而「字节没到」与「下载失败」在类型上无法区分。本轮把下载**编排**落地：`src/download.rs` 的 `PackageFetcher`/`ResumeLedger` 两条接缝 + `download_package`——短读是**值**（可重问并被清点）、传输 `Err` 是**终局**（不重问）、偏移每次从台账**读回**、append 后**回读确认**、哈希闸门的输入**读自台账**（于是「工件与声明相符」是关于本地介质的陈述）、完整但哈希不符⇒拒绝并**先丢弃**其持久化字节（否则下一次会在坏文件末尾续传，而那个位置永久不会被重取）、重问上界 `FetchPolicy::max_attempts_per_window` 耗尽⇒`RESOURCE_EXHAUSTED` 具名拒绝；失败**不产生任何东西**（本模块无法暂存/写 journal/换清单）。`tests/download.rs` **20** 条（本 crate 79→99），其中 **2** 条走在**真实 loopback TCP/HTTP/1.1**（测试内自写最小 peer/client，**零新增依赖**，故「本 crate 无 HTTP 客户端」在 dev-dependency 层面仍逐字成立）：断言 peer 记账收到的 `Range` 偏移 == `[0, 1024]`（断流后续传）与 `[0, 1, 2]`（预算耗尽且每次进度真实）。10 条独立注入逐条可归因，含「上界成对判据」的实测分工（抬高/挪动上界 ⇒ 边界判据红、幅度判据不变）。**为何仍不升 tested**：真实分发端点、真实安装器、真实磁盘与 GPU 度量仍是外部注入点，按 admission-registry「未完成或外部阻塞的目标 MUST 保留」不因守卫通过而升级。见 reports/2026-10-16-w126-download-resume-and-budget.md 与 ADR 0104（W15 的原始载体见 reports/2026-10-10-w15-upgrade-core.md）。"}
  - {id: "R10", title: "开播与回滚不丢写入", release_line: r1, automation: fault, status: implemented, evidence: "reports/2026-10-10-w15-upgrade-core.md", notes: "暂存与激活分离——开播中只暂存不激活（SessionGate 要求无活动会话，被门控的包不失效，tests/gates.rs）；降档先排空后停用且记录数不变，排空不彻底即停止；目标超 rollback_range 以 VERSION_INCOMPATIBLE 阻止静默回滚；回滚导出升级后事实与审计（ExportedWrites）。真实会话注册表（装配根）未接线，不标 tested【W123 接线进展（**维持 implemented**）】装配根已接上真实会话：`nai-runtime::Composition` 实现 `nai_upgrade_core::ActiveSessionGate`，`active()` 读**它自己持有的真实 `Session`**（单会话装配）而非 rehearsal 计数器；**活跃 = 在播**（lifecycle ∈ {Running, Draining}），Created/Ready/Stopped/Faulted 均不算——若把「一切未停止的会话」都算活跃，本装配开箱即有的 Created 会让门**恒挡**，门就成了死的而非谨慎的。**不可观测即 fail-closed**：会话锁 busy/poisoned 时 MUST 返回错误，MUST NOT 返回 0（返回 0 等于谎称「无人活跃」，会让版本切换在开播中发生）。判据见 `crates/nai-runtime/tests/composition.rs` 两条：真实 lifecycle 走 Created→Preparing→Ready→Running（Deferred{active:1}，require_idle ⇒ CapabilityNotReady）→Draining（仍 Deferred）→Stopped（Allowed）；以及 busy 锁 ⇒ Conflict（握手造竞争，不靠 sleep 赌）。**为何仍不升 tested**：本轮接的是「装配根能答 gate」，而**运行时仍无升级激活调用点**（`nai-runtime`/`apps/engine` 内无 `UpgradeTransaction` 使用处）⇒ 「开播中只暂存不激活」尚未在真实运行时链路上被执行。本项其余部分（暂存/激活分离、降档先排空后停用、排空不彻底即停、rollback_range 上限、ExportedWrites 导出）仍由 nai-upgrade-core 的 tests/gates.rs 覆盖。【W128 调用点（**维持 implemented**）】装配根已建**运行时调用点**：新增 `crates/nai-runtime/src/upgrade.rs` 的 `Composition::stage_upgrade` / `activate_staged`——`UpgradeTransaction` 在核心之外首次有生产使用处（现测命中 2 处，均在 `nai-runtime`；`apps/engine` 仍 0 命中）。**暂存不问门、激活先问门**（门只答一次，且由装配根自己持有的真实会话回答，不另立第二处判定）；门答 Deferred ⇒ 返回**非错误**的 `UpgradeActivation::Deferred{active}`，被门控的包保持 `prepared` 并在静默边界**复用而不重暂存**；门不可观测 ⇒ 原样上抛 `Conflict`（MUST NOT 表述为推迟或放行）；运行后的终局 MUST 原样携带核心 `Outcome`（含回滚成因码与宿主导出计数），运行时侧不重写不补零。判据见 `crates/nai-runtime/tests/upgrade.rs` 5 条：在播时只暂存不切换（效果计数**恰为**一次暂存、切换记录为空）／静默边界复用后恰一次切换且暂存计数仍为 1／busy 锁下暂存成功而激活 Conflict／失败的激活报**具名回滚含导出计数**而非「等待」／Draining 仍推迟而 Ready 放行（继承门的口径而非另立）。4 组注入逐条可归因（暂存先问门 ⇒ 4 红；推迟分支照样激活 ⇒ 3 红；吞掉门错误 ⇒ 1 红；抹掉导出计数 ⇒ 1 红）。**为何仍不升 tested**：①同类缺口的另一半仍在——`downgrade`/`require_rollback_compatible` 在核心之外**恰 0 个调用点**（现测，只在 `crates/nai-upgrade-core/tests/gates.rs` 被调用）⇒「降档先排空后停用」同样没在真实链路上跑过；②真实安装器与真实分发端点仍是外部注入点（第④环真值缺口），本轮所有世界效果都经 rehearsal 替身；③ADR 0100 的 `tested` 门槛（`A03` 判例：结构守卫通过但剩余缺口是外部真值 ⇒ 不具备可核验证据）。"}
  - {id: "R11", title: "离线升级与部署迁移", release_line: r2, automation: fault, status: implemented, evidence: "reports/2026-10-10-w25-tier-idle-migration.md", notes: "离线安装前置「每个声明文件都在本地」，缺件以 CAPABILITY_NOT_READY 拒绝并由 missing_artifacts 指认是哪个文件（与在线路径的 missing package content 可区分），随后复用同一条校验链；「不会偷偷下载」是编译期性质（crate 无 HTTP 客户端，否决 allow_fetch 开关）；部署迁移搬动前拒绝三件事（有活动会话→维护窗口、分布式目标+SQLite 多写者、权限无映射即拒而不静默丢弃），搬动后复验权限集合/证据版本/数据哈希三项且错误码可区分（否决只比哈希）；OutputSwitch 以 key 幂等即输出切换不重复播报，见 tests/migration.rs 11 项。真实轻云实例与真实迁移未执行，不标 tested"}
