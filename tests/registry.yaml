  - {id: "S07", title: "无明文密钥", release_line: r1, automation: unit, status: implemented, evidence: "reports/2026-10-07-d03-storage-and-credentials.md", notes: "credential_ref 已实现；仓库密钥扫描已落地（W36）——cargo xtask check --secrets 以「git 会发布的内容」（已跟踪＋未跟踪但未被忽略）为扫描域：被忽略的本地 .env 不在域内（否则本机无法持有凭据），新增文件在暂存前即入域（两条测试各钉一个方向）；按前缀＋最小长度表匹配，命中只报文件/行号/前缀族、不回显匹配内容；实测全部待发布文件零命中，见 reports/2026-10-10-w36-live-provider-evidence.md。日志面已建（W130）——cargo xtask check --secrets 连带**诊断产物域**：登记表 ARTIFACTS 只登记**有真实产生者**的目录（当前 = CI 门控日志 .nai-diagnostics/nai-gate.log，由 .github/workflows/foundation.yml 的 tee 写、scripts/ci-diagnose.mjs 发成匿名可读的 check-run annotation），凭据（marker）逐字存在于生产者文本里且点名扫描目录、生产者须是已跟踪文件且非判据自身；产物域**收下非 UTF-8**（崩溃转储是二进制：有损解码后 ASCII 段照样扫、**不静默丢弃**，并具名进 non_text）、缺目录是**值**（报「没有目录（nothing to scan）」而非「跳过」）、空集报 0、闭世界台账四桶各自独立累加（visited == 文本+非文本+非文件+容器）、**不跟随**符号链接；命中只报路径/行号/族、**不回显匹配文本**。CI 里该步带 if: always()（W100 R6）——它判的产物由**前序步**产生，GitHub 默认「前序步失败 ⇒ 后续步跳过」，失败那一次恰最该扫。诊断包与崩溃转储在仓库内**无产生者**（全仓 0 命中）⇒ 那两面的扫描**未建**（登记没有生产者的目录＝给「扫了个空目录」发通行证），S07 口径四面**已建其二**，**保持 implemented 不升级**。见 reports/2026-10-17-w130-diagnostic-artifact-secret-scan.md、docs/adr/0108-diagnostic-artifact-secret-scan.md"}
  - {id: "S08", title: "插件与供应链", release_line: r1, contract: "storage.persist@1", automation: unit, status: implemented, evidence: "reports/2026-10-07-d05-plugin-hosts-and-ipc.md", notes: "签名/信任库/宿主隔离已实现；撤销列表已落地为带期限可信缓存（RevocationList 三态：命中拒绝、未过期放行、过期拒绝；check_install 与 check_startup 双入口），见 reports/2026-10-10-w15-upgrade-core.md；**SBOM 已由 W47 落地**（新增 cargo xtask sbom：从 cargo metadata --locked 与 Cargo.lock 的 SHA-256 生成 CycloneDX 1.5，零新增依赖、离线、逐字节确定；许可三态——只在可断言时记 SPDX id/expression，旧式斜杠写法原样记 name；产物自带 scope/excluded/not-evidence-for 声明），见 reports/2026-10-11-w47-sbom-supply-chain.md 与 ADR 0043；**真实签名链仍待建**，且基线同样要求的依赖漏洞与许可政策审计（需 advisory 数据源与允许/拒绝清单）亦未建 ⇒ status 保持 implemented 不升级"}
