  - {id: "P01", title: "平台生命周期", release_line: r2, automation: integration, status: blocked, notes: "【口径】规格 §1328 的 P01 验收是「伴侣启动、退出、重连、切场次不产生旧房间播报；权限撤销停止相关功能」＝官方 SDK 认证 + 生产 composition root 平台宿主接线 + 真实启动/退出/端口冲突与网关，均为外部真值，官方 SDK 与生产宿主未实现，故为 blocked（原 notes 仅记「官方 SDK/生产宿主未实现（D13）」，此处补齐口径）。本项已交付的是**桥接生命周期**判定机制（W35）；**D13 已交付的是平台事件准入**——nai-kernel::platform 的 PlatformLink（可信 root 认证/房间来源/权限快照/连接代次/断线清权限/重连要求新 revision/事件来源房间 epoch 代次时间校验），判的是「一个事件能不能进」，与本项的「桥接进程生命周期」是两个面、互补不重叠。判定机制：§27.1「桥接只做」四项封闭集落成 duty_outside_bridge_scope；§1328 四类转换各有处置且各清播报授权、各写决策日志；§1328「不产生旧房间播报」落成授权绑定房间与连接代次的 stale_room_broadcast_permitted 与 may_broadcast（状态面不受「是否声明桥接」门控）；§347 退出转待机、重连不恢复旧自动权限；§349 能力快照 unknown 取最严格且「缺失能力只关闭对应功能」双向判定（欠关闭 feature_active_without_capability / 因能力变更过关闭 feature_stopped_despite_capability）；§119 平台中断撤自动、保手工与回放；§347 七类情形各有处置与记录；§27.1/§1075 SDK 只经固定路径与签名 nonce 令牌校验加载；§27.1 无官方 SDK 时如实记 UNVERIFIED_EXTERNAL_DEPENDENCY、不用 fake connector 冒充；§27.1 回调不同步等待 LLM 或磁盘。落 crates/nai-kernel/src/bridge.rs（19 条稳定标记，tests/bridge.rs 44 项）"}
