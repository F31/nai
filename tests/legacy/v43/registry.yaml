  "invariants": [
    {
      "id": "INV-01",
      "requirement": "无相应渠道/用途/行为许可不外发受限内容，unknown不当granted"
    },
    {
      "id": "INV-02",
      "requirement": "AI/模板/缓存/预生成均执行input/evidence/output及交付前门控（媒体preplay/其他pre-dispatch），不绕过guard"
    },
    {
      "id": "INV-03",
      "requirement": "审批绑定bundle hash、session/epoch、版本、角色/范围、TTL，不接受模型自授"
    },
    {
      "id": "INV-04",
      "requirement": "旧epoch/过期/撤销结果不得再次提交/播放，重新连接不自动恢复"
    },
    {
      "id": "INV-05",
      "requirement": "敏感事实依据当前有效发布源，图/字幕/素材同样绑定与失效"
    },
    {
      "id": "INV-06",
      "requirement": "本地P0独立于engine/云/DB，鉴权后幂等先停，实际ACK不等于平台已静音"
    },
    {
      "id": "INV-07",
      "requirement": "新授权扩大先持久化，撤销/静音先执行后审计，失败保持拒绝"
    },
    {
      "id": "INV-08",
      "requirement": "值守由主动确认短租约，网络心跳不续人工值守"
    },
    {
      "id": "INV-09",
      "requirement": "外部文本/文档/工具/Agent均不具有系统指令或授权权力"
    },
    {
      "id": "INV-10",
      "requirement": "模型无高风险交易/配置/任意执行权限，动作白名单与实际执行器复核"
    },
    {
      "id": "INV-11",
      "requirement": "所有队列/循环/结果/调用有界，deadline与预算并行约束"
    },
    {
      "id": "INV-12",
      "requirement": "签名不等于安全，原生进程不等于沙箱，未知原生不进内核"
    },
    {
      "id": "INV-13",
      "requirement": "凭据受控引用，UI/仓库/日志/支持包不含明文，生产限制完整转储"
    },
    {
      "id": "INV-14",
      "requirement": "local_only/个人数据按用途与目的地强制过滤，不以“本地库”掩盖API外发"
    },
    {
      "id": "INV-15",
      "requirement": "访客长期记忆默认关，作用域/同意/保留/删除可验证，不跨平台昵称合并"
    },
    {
      "id": "INV-16",
      "requirement": "真人原声不宣称经过LLM语义预审；设备/音轨/平台/标识/P0仍执行"
    },
    {
      "id": "INV-17",
      "requirement": "每个音轨/输出ownership明确，全静音覆盖全部bus，无双重收音"
    },
    {
      "id": "INV-18",
      "requirement": "必需视觉/模型帧就绪才commit，可选只用预授权替代，不展示其他对象"
    },
    {
      "id": "INV-19",
      "requirement": "影子/试听私有sink隔离，不能误进入真实直播输出"
    },
    {
      "id": "INV-20",
      "requirement": "实际完成以对应目标的播放/发送/动作ACK证据，生成/HTTP202不算完成；不推定用户已读"
    },
    {
      "id": "INV-21",
      "requirement": "决策链完整性不等于防管理员篡改；删除payload不能被回放恢复"
    },
    {
      "id": "INV-22",
      "requirement": "升级维护窗口+可恢复journal，回滚不静默丢新增数据"
    },
    {
      "id": "INV-23",
      "requirement": "三档同核心；edition/deployment/presentation/behavior/delivery不硬编码等价"
    },
    {
      "id": "INV-24",
      "requirement": "未启用不启动对应资源；市场/许可证暂不可达不自动切断合法本地会话"
    },
    {
      "id": "INV-25",
      "requirement": "安全/肖像/声线/权限撤销优先即时，不被商业宽限覆盖"
    },
    {
      "id": "INV-26",
      "requirement": "kernel不依赖业务插件/SDK/Tauri，插件无直接实现依赖"
    },
    {
      "id": "INV-27",
      "requirement": "能力生命周期、实现、认证、证据独立，不能用mock/文档检查冒充真实通过"
    },
    {
      "id": "INV-28",
      "requirement": "已发布内容不可原地覆盖，需求/演示/交接确认与推断区分"
    },
    {
      "id": "INV-29",
      "requirement": "任意生产输出走DeliveryGate；纯文字不依赖假音频，也不绕过授权"
    },
    {
      "id": "INV-30",
      "requirement": "影响分析未知不可当无影响；处置部分失败不解除已有撤销"
    },
    {
      "id": "INV-31",
      "requirement": "失败后替代展示不冒充实时步骤成功，不静默替换批准对象"
    },
    {
      "id": "INV-32",
      "requirement": "传输ACK、已读、接手、采纳与解决分别取证，未知保持未知"
    },
    {
      "id": "INV-33",
      "requirement": "呈现/部署可选；订阅升级不隐含写实、云或平台已获准"
    },
    {
      "id": "INV-34",
      "requirement": "停止/撤销对未交付与已交付结果分别报告，不宣称撤回外部已执行动作"
    },
    {
      "id": "INV-35",
      "requirement": "角色化智能体共用授权/预算；context过时重检，不因建议采纳绕过输出门"
    },
    {
      "id": "INV-36",
      "requirement": "系列复用不复制旧批准/租约/观众身份；偏好和复盘不自动成为权威事实"
    },
    {
      "id": "INV-37",
      "requirement": "私有提词/联系方式与公共画面隔离，场景切换不可误捕获"
    },
    {
      "id": "INV-38",
      "requirement": "无授权数据不伪造热度/个体画像/效果；无意义播报时长不是优化目标"
    },
    {
      "id": "INV-39",
      "requirement": "主持权显式切换；VAD/网络心跳/模型建议不能授予自动外发权限"
    },
    {
      "id": "INV-40",
      "requirement": "复盘/生成有单独预算且可取消，未启用辅助不产生对应付费后台任务"
    }
  ],
