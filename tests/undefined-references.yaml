schema_version: 1
# 本台账登记**「被引用了却没定义」**的引用式使用（`[text][label]` 里 label 在本文件没有定义）。
#
# 为什么要台账：按 CommonMark，这种写法退化成**字面文本**，读者看到的正是作者写下的字 ⇒ 它
# **不是指针**，判据不判它指向哪里（ADR 0127 决策 2）。但「不是指针」不等于「不需要有人认领」：
# 一处笔误（本想写链接、少打一个字符）与一处引注在这里**字形完全一样**，只有人能分辨。
# ⇒ 每一处都必须在下面被具名认领，否则 `doc-links` 判据失败（ADR 0128）。
#
# 认领状态是封闭枚举，两种状态各付一条**可被机械否证**的声称，且方向相反：
#   - `citation`：本文档的资料清单里有给该标签作证的条目（`- [S3] …` / `- **[S14] …**` /
#     `- [S1 标题](url)` 三种写法都算）⇒ 判据去找，找不到就是声称倒了。
#   - `missing_bibliography`：本文档**一条资料清单都没有**，那条引注无出处可核；必填 `closure`
#     写「取到什么算闭合」。一旦补出清单，本条**自行过期**（判据会红），MUST NOT 留着。
#     ⚠️ 今天本仓 **0 条**这种状态（现测 4 份清单都在）——它存在的理由是：没有这个取值，
#     第一处真正的无出处引注就只有「判红」一条路，而修它需要仓外的真实来源。
#     与 W153 的定义行/锚点一样，这一支的全部证据是**合成样本 + 注入**，如实登记。
#
# 键是 `(path, label)`，`count` 是这条键在文件里出现的**次数**：不写行号，因为行号会随上文
# 增删漂移，而「同一个标签出现几次」才是这条声称的内容。`note` 只给人读，不参与判定。
#
# 台账**不是豁免**：双向核对（实际有、台账无 ⇒ 红；台账有、实际无或条数变 ⇒ 红），两种声称
# 都要被否证。随手登记一条既糊不过去，记录一改还会自己报过期（MEMORY §7）。
