nai-runtime.workspace = true
nai-control-api.workspace = true
nai-plugin-sdk.workspace = true
nai-avatar-2d = { path = "../../plugins/avatar-2d" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
