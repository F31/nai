[package]
name="nai-workbench-desktop"
version="0.1.0"
edition="2024"
rust-version="1.96"
license="MIT"
[workspace]
[dependencies]
nai-contracts={path="../../crates/nai-contracts"}
prost="=0.14.4"
tauri={version="=2.12.4",features=["custom-protocol"]}
nai-workbench-host={path="../../crates/nai-workbench-host"}
nai-avatar-2d={path="../../plugins/avatar-2d"}
nai-plugin-sdk={path="../../crates/nai-plugin-sdk"}
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.151"
sha2="=0.11.0"
png="=0.17.16"
nai-avatar-files={path="../../crates/nai-avatar-files"}
nai-media-core={path="../../crates/nai-media-core"}
nai-kernel={path="../../crates/nai-kernel"}
[target.'cfg(windows)'.dependencies]
rfd={version="=0.15.4",default-features=false}
[build-dependencies]
tauri-build={version="=2.7.3",features=[]}
png="=0.17.16"
[lints.rust]
unsafe_code="forbid"


