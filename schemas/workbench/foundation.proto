message LiveAutoStop { LiveRunRead run=1; string grant_id=2; string reason=3; }
message LiveAutoConfirm { LiveRunRead run=1; string grant_id=2; FoundationPublicCandidate candidate=3; string bundle_sha256=4; }
message LiveAutoTask { uint32 sentence_cursor=1; string preview_id=2; string preview_sha256=3; string task_id=4; string task_sha256=5; AgentTaskState task_state=6; string model_id=7; uint64 model_revision=8; }
message LiveAutoView { string run_id=1; string grant_id=2; string state=3; string reason=4; string model_id=5; uint64 model_revision=6; string voice=7; string output_id=8; uint64 max_cost_minor=9; uint64 reserved_minor=10; uint64 expires_at_ms=11; repeated LiveAutoTask tasks=12; uint32 sentence_cursor=13; uint32 sentence_total=14; string interruption_id=15; string interruption_state=16; string question=17; string answer=18; uint32 return_cursor=19; }
