// Public AV metadata only: raw media uses a separate owned transport.
message PublicMediaAudio { string artifact_id=1; string pcm_sha256=2; uint64 sample_count=3; uint32 sample_rate=4; uint32 channels=5; }
message PublicMediaVisual { string artifact_id=1; string package_sha256=2; string license_sha256=3; uint32 width=4; uint32 height=5; uint32 fps=6; }
