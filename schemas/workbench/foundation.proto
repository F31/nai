message FoundationLlmModel { string workspace_id=1; string model_id=2; uint64 expected_revision=3; string name=4; string base_url=5; string model=6; uint64 input_minor_per_million=7; uint64 output_minor_per_million=8; bool enabled=9; bytes api_key=10; bool prices_confirmed=11; }
