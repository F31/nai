// Native parent-only observation, stripped from ordinary page commands.
message PublicOutputBindingChallenge { uint64 challenge=1; uint32 ttl_ms=2; }
message PublicOutputObservation { uint64 challenge=1; PublicOutputStatus status=2; string stop_nonce=3; }
// Preparation metadata only. No PCM/pixels/path, no approval or device completion claim.
message PreparedMediaReceipt {
 uint32 protocol_major = 1;
 string descriptor_sha256 = 2;
 string consumer_instance_id = 3;
 string pcm_sha256 = 4;
 uint64 sample_count = 5;
 uint64 expected_frames = 6;
 string first_frame_sha256 = 7;
 PublicMediaFrameInfo tail_frame = 8;
}

message PreparedMediaDescriptor { uint32 protocol_major=1; string workspace_id=2; string task_id=3; string task_sha256=4; PublicMediaAudio audio=5; PublicMediaVisual visual=6; uint64 expected_frames=7; uint32 samples_per_frame=8; string first_frame_sha256=9; string pcm_format=10; string pixel_format=11; string renderer_id=12; }
