syntax = "proto3";
package nai.workbench.v1;
import "workbench/bootstrap.proto";

enum FoundationRole { FOUNDATION_ROLE_NONE=0; FOUNDATION_ROLE_ADMIN=1; FOUNDATION_ROLE_OPERATOR=2; FOUNDATION_ROLE_VIEWER=3; }
enum FoundationTarget { FOUNDATION_TARGET_UNSPECIFIED=0; FOUNDATION_TARGET_PRIVATE_CARD=1; }
// Explicit budget semantics for the shared-catalog/workspace-settings slice.
// UNSPECIFIED must never grant unlimited spending; legacy zero stays disabled.
enum WorkspaceBudgetMode { WORKSPACE_BUDGET_MODE_UNSPECIFIED=0; WORKSPACE_BUDGET_MODE_DISABLED=1; WORKSPACE_BUDGET_MODE_LIMITED=2; WORKSPACE_BUDGET_MODE_UNLIMITED=3; }
message WorkspaceSettingsDraft { string name=1; WorkspaceBudgetMode budget_mode=2; uint64 budget_limit_minor=3; string currency=4; uint64 expected_revision=5; }
// Trusted migration mapping; never accepts a page-supplied credential scope.
message WorkspaceSettingsCommand { string workspace_id=1; WorkspaceSettingsDraft settings=2; }
message SharedModelMigrationEntry { string catalog_model_id=1; string source_workspace_id=2; string source_model_id=3; uint64 source_revision=4; string source_sha256=5; string capability=6; }
message SharedModelPreviewRow { SharedModelMigrationEntry source=1; string name=2; string workspace_name=3; bool recycled=4; bool credential_saved=5; repeated string issues=6; }
message SharedModelPreview { repeated SharedModelPreviewRow rows=1; string plan_sha256=2; bool executable=3; }
message SharedModelMigration { string migration_id=1; string plan_sha256=2; repeated SharedModelMigrationEntry entries=3; }
message SharedModelMigrationStatus { string migration_id=1; string stage=2; uint32 completed=3; uint32 total=4; string backup_id=5; string backup_manifest_sha256=6; SharedModelMigration request=7; }
message WorkspacePurgeRead { string workspace_id=1; uint64 expected_revision=2; }
message WorkspacePurgeCommand { string workspace_id=1; uint64 expected_revision=2; string plan_sha256=3; bool acknowledge=4; }
message WorkspacePurgeCount { string kind=1; uint64 count=2; }
message WorkspacePurgePlan { string workspace_id=1; uint64 revision=2; string plan_sha256=3; repeated WorkspacePurgeCount counts=4; repeated string blockers=5; uint64 retained_audit_records=6; uint64 retained_budget_records=7; uint32 file_count=8; string name=9; }
message WorkspacePurgeStatus { string workspace_id=1; bool deleted=2; uint32 pending_files=3; bool cleanup_blocked=4; }
message FoundationWorkspace { string workspace_id=1; string name=2; uint64 budget_limit_minor=3; string currency=4; }
enum WorkspaceAction { WORKSPACE_ACTION_INSPECT=0; WORKSPACE_ACTION_DELETE_EMPTY=1; WORKSPACE_ACTION_RECYCLE=2; WORKSPACE_ACTION_RESTORE=3; }
message FoundationWorkspaceLifecycle { string workspace_id=1; uint64 expected_revision=2; WorkspaceAction action=3; }
message FoundationWorkspaceRename { string workspace_id=1; string name=2; uint64 expected_revision=3; }
message FoundationGrant { string workspace_id=1; string principal_id=2; FoundationRole role=3; uint64 expected_revision=4; }
// Proposed avatar authority metadata. Not a command, grant, rights proof, or
// public media permit until trusted owner admission and authorization are wired.
message AvatarBindingIdentity {
 string workspace_id=1;
 string profile_id=2;
 string package_sha256=3;
 string rights_sha256=4;
}
enum AvatarRightsState {
 AVATAR_RIGHTS_STATE_UNSPECIFIED=0;
 AVATAR_RIGHTS_STATE_ACTIVE=1;
 AVATAR_RIGHTS_STATE_REVOKED=2;
}
message AvatarBindingMutation {
 AvatarBindingIdentity identity=1;
 uint64 expected_revision=2;
}
message AvatarBindingView {
 AvatarBindingIdentity identity=1;
 uint64 revision=2;
 AvatarRightsState rights_state=3;
 bool selected=4;
}
// Metadata for a proposed backup closure. A matching manifest alone does not
// establish that package files were copied or that rights remain valid.
message AvatarBackupPackageIdentity {
 string package_sha256=1;
 string rights_sha256=2;
}
message AvatarBackupInventory {
 string database_sha256=1;
 repeated AvatarBackupPackageIdentity packages=2;
}
message FoundationObject { string workspace_id=1; string object_id=2; uint64 expected_revision=3; string body=4; }
message FoundationReadObject { string workspace_id=1; string object_id=2; uint64 revision=3; }
message FoundationSession { string workspace_id=1; string session_id=2; }
message FoundationDelivery { string workspace_id=1; string delivery_id=2; string session_id=3; string object_id=4; uint64 object_revision=5; string object_sha256=6; FoundationTarget target=7; DeliveryScope scope=8; uint32 ttl_ms=9; }
message FoundationApprove { string workspace_id=1; string delivery_id=2; string bundle_sha256=3; }
message FoundationDispatch { string workspace_id=1; string delivery_id=2; }
message FoundationRead { string workspace_id=1; string delivery_id=2; }
message FoundationStop { string workspace_id=1; string session_id=2; }
message FoundationDelete { string workspace_id=1; string object_id=2; uint64 expected_revision=3; }
enum PublicationStatus { PUBLICATION_STATUS_UNSPECIFIED=0; PUBLICATION_STATUS_PRIVATE_CONTENT=1; PUBLICATION_STATUS_BLOCKED=2; }
message FoundationImpact { string workspace_id=1; string report_id=2; string show_id=3; uint64 show_revision=4; string previous_snapshot_id=5; }
message FoundationPublish { string workspace_id=1; string snapshot_id=2; string report_id=3; string report_sha256=4; bool acknowledge_unknown=5; }
message FoundationPublicationRead { string workspace_id=1; string snapshot_id=2; }
message FoundationPublicationRevoke { string workspace_id=1; string revocation_id=2; string snapshot_id=3; string snapshot_sha256=4; string reason=5; }
message FoundationBrowse { string workspace_id=1; string kind=2; string after_id=3; uint32 limit=4; }
message FoundationResource { string id=1; string name=2; string kind=3; uint64 revision=4; string sha256=5; uint64 updated_at_ms=6; string parent_id=7; uint64 created_at_ms=8; bool recycled=9; bool has_content=10; }
message FoundationPreview { string workspace_id=1; string preview_id=2; string snapshot_id=3; string snapshot_sha256=4; string cue_id=5; string session_id=6; uint64 expected_epoch=7; }
message FoundationPreviewRead { string workspace_id=1; string preview_id=2; }
message FoundationPreviewPresented { string workspace_id=1; string preview_id=2; string preview_sha256=3; string receipt_id=4; }
message FoundationPreviewStop { string workspace_id=1; string session_id=2; uint64 expected_epoch=3; }

enum AgentTaskState { AGENT_TASK_STATE_UNSPECIFIED=0; AGENT_TASK_STATE_CREATED=1; AGENT_TASK_STATE_QUEUED=2; AGENT_TASK_STATE_RUNNING=3; AGENT_TASK_STATE_WAITING_HUMAN=4; AGENT_TASK_STATE_COMPLETED=5; AGENT_TASK_STATE_CANCELLED=6; AGENT_TASK_STATE_EXPIRED=7; AGENT_TASK_STATE_FAILED=8; }
enum SuggestionState { SUGGESTION_STATE_UNSPECIFIED=0; SUGGESTION_STATE_PROPOSED=1; SUGGESTION_STATE_ACCEPTED=2; SUGGESTION_STATE_EDITED=3; SUGGESTION_STATE_REJECTED=4; SUGGESTION_STATE_EXPIRED=5; }
enum FaqReason { FAQ_REASON_UNSPECIFIED=0; FAQ_REASON_EXACT=1; FAQ_REASON_NO_MATCH=2; FAQ_REASON_AMBIGUOUS=3; FAQ_REASON_STALE_CONTEXT=4; FAQ_REASON_EXPIRED=5; FAQ_REASON_REVOKED=6; FAQ_REASON_CANCELLED=7; FAQ_REASON_RESOLVED=8; FAQ_REASON_RETRIEVED=9; }
// Shared source context is identity/freshness metadata, never a public media permission.
message AgentTaskContext { string workspace_id=1; string snapshot_id=2; string snapshot_sha256=3; string facts_sha256=4; string context_sha256=5; }
enum LiveRunState { LIVE_RUN_STATE_UNSPECIFIED=0; LIVE_RUN_STATE_READY=1; LIVE_RUN_STATE_DISPATCHING=2; LIVE_RUN_STATE_PAUSE_REQUESTED=3; LIVE_RUN_STATE_PAUSED=4; LIVE_RUN_STATE_COMPLETED=5; LIVE_RUN_STATE_INTERRUPTED=6; LIVE_RUN_STATE_ENDED=7; LIVE_RUN_STATE_UNAVAILABLE=8; }
enum LiveRunAction { LIVE_RUN_ACTION_UNSPECIFIED=0; LIVE_RUN_ACTION_PAUSE=1; LIVE_RUN_ACTION_RESUME=2; LIVE_RUN_ACTION_END=3; LIVE_RUN_ACTION_RECOVER=4; LIVE_RUN_ACTION_SKIP_INTERRUPTED=5; }
// Private inherited worker pipe. PCM never enters these messages.
message MicDevice { uint32 device_id=1; string name=2; bool is_default=3; }
message MicControl { string authorization=1; string instance_id=2; uint64 seq=3; uint64 challenge=4; uint32 action=5; string session_id=6; uint32 input_id=7; uint32 output_id=8; bool acknowledge_route=9; uint32 protocol_major=10; }
message MicStatus { string instance_id=1; uint64 seq=2; uint64 challenge=3; bool active=4; string reason=5; repeated MicDevice inputs=6; repeated MicDevice outputs=7; uint32 input_id=8; uint32 output_id=9; uint64 captured_frames=10; uint64 submitted_frames=11; uint64 dropped_frames=12; uint64 underrun_frames=13; uint32 peak_q16=14; string session_id=15; uint32 protocol_major=16; }
message LiveTakeoverControl { LiveRunRead run=1; string takeover_id=2; uint64 expected_epoch=3; bool resume=4; bool acknowledge=5; bool skip_partial_sentence=6; }
enum ReviewRunKind { REVIEW_RUN_KIND_UNSPECIFIED=0; REVIEW_RUN_KIND_MANUAL=1; REVIEW_RUN_KIND_LIVE=2; }
message ReviewSource { string workspace_id=1; string run_id=2; ReviewRunKind run_kind=3; }
message ReviewObjectRef { string object_id=1; uint64 revision=2; string sha256=3; }
message ReviewFaq { string id=1; string question=2; string text=3; repeated string fact_ids=4; }
message ReviewFact { string id=1; string label=2; string value=3; }
message ReviewNoteSave { ReviewSource source=1; string note_id=2; uint64 expected_revision=3; string title=4; ReviewFaq proposal=5; ReviewObjectRef question_source=6; }
message ReviewNoteView { string note_id=1; uint64 revision=2; string title=3; ReviewFaq proposal=4; uint64 created_at_ms=5; string evidence=6; ReviewObjectRef question_source=7; }
message ReviewContext { ReviewSource source=1; string run_name=2; uint64 run_revision=3; string snapshot_id=4; string snapshot_sha256=5; ReviewObjectRef product=6; ReviewObjectRef show=7; repeated ReviewFaq published_faq=8; repeated ReviewFaq current_faq=9; repeated ReviewFact facts=10; repeated ReviewNoteView notes=11; bool facts_unchanged=12; string reason=13; repeated ReviewQuestion questions=14; uint32 question_capacity=15; }
message RunQuestionPoolRead { ReviewSource source=1; QuestionPoolRead scope=2; uint64 expected_epoch=3; }
message ReviewRunQuestion { ReviewSource source=1; QuestionPoolEnqueue question=2; uint64 expected_epoch=3; }
message ReviewQuestion { ReviewObjectRef record=1; string question_id=2; string question=3; uint32 occurrences=4; string processing=5; string delivery=6; string candidate_id=7; bool runtime_expired=8; uint64 expires_at_ms=9; uint64 updated_at_ms=10; string candidate_sha256=11; }
message ReviewDraftPlan { ReviewSource source=1; string note_id=2; uint64 note_revision=3; string job_id=4; string target_product_id=5; string target_show_id=6; uint64 expected_product_revision=7; uint64 expected_show_revision=8; }
message ReviewDraftRead { string workspace_id=1; string job_id=2; }
message ReviewDraftApply { string workspace_id=1; string job_id=2; uint64 expected_revision=3; string expected_sha256=4; bool acknowledge=5; }
message ReviewDraftView { ReviewSource source=1; string job_id=2; uint64 revision=3; string sha256=4; string state=5; string reason=6; string note_id=7; ReviewObjectRef base_product=8; ReviewObjectRef base_show=9; ReviewFaq before=10; ReviewFaq current=11; ReviewFaq proposal=12; string target_product_id=13; string target_show_id=14; ReviewObjectRef saved_product=15; ReviewObjectRef saved_show=16; }
message LiveQuestionControl { LiveRunRead run=1; string grant_id=2; string interruption_id=3; string faq_task_id=4; string faq_task_sha256=5; uint64 expected_revision=6; uint64 expected_epoch=7; bool acknowledge_answer=8; bool cancel=9; }
