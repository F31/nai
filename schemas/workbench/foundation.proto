enum FaqDecision { FAQ_DECISION_UNSPECIFIED=0; FAQ_DECISION_ACCEPT=1; FAQ_DECISION_EDIT=2; FAQ_DECISION_IGNORE=3; FAQ_DECISION_CANCEL=4; }
