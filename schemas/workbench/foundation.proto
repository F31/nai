message LiveBatchApproval { string approval_id=1; string plan_sha256=2; uint64 expires_at_ms=3; bool approved=4; bool revoked=5; }
message LiveBatchControl { LiveRunRead run=1; uint64 expected_revision=2; uint64 expected_epoch=3; string approval_id=4; string plan_sha256=5; bool acknowledge_rights=6; bool revoke=7; }
message LiveSentence { string cue_id=1; uint32 sentence_index=2; string text=3; }
message LiveSpeechPlan { AgentTaskContext source=1; string run_id=2; uint64 revision=3; uint64 epoch=4; repeated LiveSentence sentences=5; uint32 current_start=6; uint32 prefetch_limit=7; uint32 max_sentence_chars=8; string plan_sha256=9; LiveBatchApproval batch_approval=10; }
