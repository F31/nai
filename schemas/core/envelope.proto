syntax = "proto3";
package nai.v1;
import "core/base.proto";
import "core/error.proto";

// payload is a bounded encoded control message, never PCM or image pixels.
message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string message_type = 3;
  string message_id = 4;
  string request_id = 5;
  string trace_id = 6;
  string session_id = 7;
  optional uint64 generation_epoch = 8;
  optional uint64 sent_at_utc_ms = 9;
  bytes payload = 10;
  uint32 remaining_budget_ms = 11;
}
message ProtocolRange { uint32 major = 1; uint32 min_minor = 2; uint32 max_minor = 3; }
message Handshake {
  string plugin_id = 1;
  string plugin_version = 2;
  repeated ProtocolRange protocol_ranges = 3;
  bytes nonce = 4;
  string runtime_session_id = 5;
  bytes identity_material = 6;
  HostKind host = 7;
}
message HandshakeAck { uint32 protocol_major = 1; uint32 protocol_minor = 2; bytes peer_nonce = 3; ContractError error = 4; }
message CancelRequest { RequestContext context = 1; string target_request_id = 2; string reason_code = 3; }
message CancelAck { string target_request_id = 1; bool cancellation_recorded = 2; }
message CapabilityInvocation { RequestContext context = 1; string capability_id = 2; string operation = 3; bytes arguments = 4; }
message CapabilityResult { string request_id = 1; uint32 seq = 2; StreamEnd end = 3; bytes data = 4; ContractError error = 5; }
