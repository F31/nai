syntax = "proto3";
package nai.v1;

enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  UNAUTHENTICATED = 2;
  PERMISSION_DENIED = 3;
  CAPABILITY_ABSENT = 4;
  CAPABILITY_NOT_READY = 5;
  VERSION_INCOMPATIBLE = 6;
  RESOURCE_EXHAUSTED = 7;
  DEADLINE_EXCEEDED = 8;
  STALE_EPOCH = 9;
  EVIDENCE_EXPIRED = 10;
  APPROVAL_EXPIRED = 11;
  BUDGET_EXCEEDED = 12;
  PROVIDER_UNAVAILABLE = 13;
  CANCELLED = 14;
  CONFLICT = 15;
  INTERNAL = 16;
  // The thing named by the request does not exist. Distinct from
  // CAPABILITY_ABSENT (nothing implements this surface) and from
  // CAPABILITY_NOT_READY (it exists but cannot run yet): "we have no record of
  // that transaction" is a different fact from "we have no job surface", and
  // collapsing them makes the two indistinguishable to every caller.
  NOT_FOUND = 17;
}
message ContractError {
  string request_id = 1;
  ErrorCode code = 2;
  string category = 3;
  bool retryable = 4;
  string message = 5;
  map<string, string> details = 6;
}
