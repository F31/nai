syntax = "proto3";
package nai.v1;
import "core/base.proto";

enum EventSource { SOURCE_UNSPECIFIED = 0; SOURCE_MANUAL = 1; SOURCE_REPLAY = 2; SOURCE_OFFICIAL = 3; }
enum EventKind { EVENT_UNKNOWN = 0; COMMENT = 1; GIFT = 2; LIKE = 3; FOLLOW = 4; UNFOLLOW = 5; FANSCLUB = 6; ENTER = 7; ROOM_STARTED = 8; ROOM_ENDED = 9; PERMISSION_CHANGED = 10; CONNECTION_CHANGED = 11; }
enum QuantitySemantics { QUANTITY_UNKNOWN = 0; DELTA = 1; CUMULATIVE = 2; }
message EventSubscription { RequestContext context = 1; string platform = 2; string app_scope = 3; string room_id = 4; }
// Fine-grained PermissionSnapshot keys: platform.events@1/<EventKind name>,
// e.g. platform.events@1/COMMENT. Missing or unknown is never granted.
message PlatformEvent {
  string event_id = 1; string session_id = 2; string platform = 3;
  string app_scope = 4; string room_id = 5; string room_source_ref = 6;
  EventSource source = 7; EventKind kind = 8;
  optional uint64 event_at_utc_ms = 9; uint64 received_at_utc_ms = 10;
  uint32 payload_version = 11; string permission_authority_ref = 12;
  string viewer_scoped_id = 13; string text = 14;
  optional uint64 quantity = 15; QuantitySemantics quantity_semantics = 16;
  string combo_id = 17; string dedup_strategy = 18; uint64 expires_at_utc_ms = 19;
  // Required by official-event admission; absent epoch and generation 0 fail closed.
  optional uint64 generation_epoch = 20; uint64 connection_generation = 21;
}
message PlatformCapabilitiesRequest { RequestContext context = 1; string platform = 2; string app_scope = 3; }
message PlatformCapabilities { string platform = 1; string app_scope = 2; string room_id = 3; PermissionSnapshot permissions = 4; bool connected = 5; }
message PlatformLifecycleRequest { RequestContext context = 1; string action = 2; }
message PlatformLifecycleResult { bool connected = 1; string reason_code = 2; PermissionSnapshot permissions = 3; }
