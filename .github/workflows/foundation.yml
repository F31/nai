name: V4.3 foundation and preparation drafts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENSPEC_TELEMETRY: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '21.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux protobuf runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev
      - name: Check generated contracts
        run: cargo xtask schema --check
      # schema --check verifies generated sources without writing them; the UI
      # tests import the compiled TypeScript output, which is not tracked.
      - name: Build TypeScript contracts
        run: pnpm --filter @nai/contracts build
      - name: Workbench engineering scope
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .nai-diagnostics
          cargo xtask check --profile workbench 2>&1 | tee ".nai-diagnostics/nai-gate.log"
      # TEMPORARY DIAGNOSTICS: remove once the Windows-only gate failure is identified.
      - name: PROBE 1/8 deps
        if: always() && runner.os == 'Windows'
        run: cargo xtask check-deps
      - name: PROBE 2/8 registry
        if: always() && runner.os == 'Windows'
        run: cargo xtask check --registry
      - name: PROBE 3/8 xtask workbench tests
        if: always() && runner.os == 'Windows'
        run: cargo test -p nai-xtask --lib workbench_tests --locked
      - name: PROBE 4/8 contract and ui node tests
        if: always() && runner.os == 'Windows'
        shell: bash
        run: node --test tests/contracts/workbench-source.test.mjs tests/contracts/foundation.test.mjs tests/contracts/preparation.test.mjs tests/contracts/publication.test.mjs tests/contracts/workbench-ci.test.mjs tests/ui/v43-bootstrap.test.mjs tests/ui/v43-preparation.test.mjs tests/ui/v43-faq.test.mjs tests/ui/v43-llm.test.mjs
      - name: PROBE 5/8 six package tests
        if: always() && runner.os == 'Windows'
        run: cargo test -p nai-foundation-sqlite -p nai-runtime-core -p nai-workbench-engine -p nai-audition-worker -p nai-public-output-keeper -p nai-llm-openai --locked
      - name: PROBE 6/8 deps tests
        if: always() && runner.os == 'Windows'
        run: cargo test -p nai-xtask --lib deps::tests --locked
      - name: PROBE 7/8 clippy
        if: always() && runner.os == 'Windows'
        run: cargo clippy -p nai-foundation-sqlite -p nai-runtime-core -p nai-workbench-engine -p nai-workbench-host -p nai-public-output-keeper -p nai-llm-openai --all-targets --locked -- -D warnings
      - name: PROBE 8/8 frontend
        if: always() && runner.os == 'Windows'
        run: node scripts/workbench-frontend.mjs
      - name: Three-language contract interoperability
        if: runner.os == 'Linux'
        run: cargo xtask test --suite contracts
      - name: Windows native engine and host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p nai-workbench-engine -p nai-public-output-keeper --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NAI_WORKBENCH_ENGINE = Join-Path $pwd 'target/debug/nai-workbench-engine.exe'
          $env:NAI_FOUNDATION_ENGINE = Join-Path $pwd 'target/debug/nai-foundation-engine.exe'
          $env:NAI_PUBLIC_OUTPUT_KEEPER = Join-Path $pwd 'target/debug/nai-public-output-keeper.exe'
          cargo test -p nai-workbench-host --locked --tests -- --test-threads=1
      - name: Windows independent desktop build and smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path apps/workbench-desktop/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-workbench-desktop.ps1 -Desktop (Join-Path $pwd 'apps/workbench-desktop/target/debug/nai-workbench-desktop.exe') -Engine (Join-Path $pwd 'target/debug/nai-workbench-engine.exe') -Foundation (Join-Path $pwd 'target/debug/nai-foundation-engine.exe')
      - name: OpenSpec validation
        run: pnpm spec:validate
      - name: Scan repository and diagnostics
        if: always()
        run: cargo xtask check --secrets

