name: V4.3 foundation and preparation drafts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows 门控逐包串行实测 17-22 分钟，加原生 3 分钟与桌面构建冒烟约 6 分钟，
    # 30 分钟上限会在收尾步骤切断 job（结论记 cancelled 而非 failure）。45 分钟仍能捕获真挂死。
    timeout-minutes: 45
    env:
      OPENSPEC_TELEMETRY: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '21.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux protobuf runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev
      - name: Check generated contracts
        run: cargo xtask schema --check
      # schema --check verifies generated sources without writing them; the UI
      # tests import the compiled TypeScript output, which is not tracked.
      - name: Build TypeScript contracts
        run: pnpm --filter @nai/contracts build
      # v561 原生传输用例通过 NAI_V561_PYTHON 拉起 tests/v561/avatar_stream_pipe_child.py，
      # 该脚本只依赖 protobuf/numpy/soxr。变量缺席时用例直接 panic（不是跳过），
      # 所以门控之前必须准备好解释器；两个平台用同一段脚本，避免只在一边成立。
      - name: Prepare V5.6.1 avatar transport interpreter
        shell: bash
        run: |
          python -m venv .nai-v561-python 2>/dev/null || python3 -m venv .nai-v561-python
          if [ -x .nai-v561-python/Scripts/python.exe ]; then
            interpreter="$(pwd)/.nai-v561-python/Scripts/python.exe"
          else
            interpreter="$(pwd)/.nai-v561-python/bin/python"
          fi
          "$interpreter" -m pip install --quiet --disable-pip-version-check protobuf numpy soxr
          echo "NAI_V561_PYTHON=$interpreter" >> "$GITHUB_ENV"
      - name: Workbench engineering scope
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .nai-diagnostics
          cargo xtask check --profile workbench 2>&1 | tee ".nai-diagnostics/nai-gate.log"
      - name: Three-language contract interoperability
        if: runner.os == 'Linux'
        run: cargo xtask test --suite contracts
      - name: Windows native engine and host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p nai-workbench-engine -p nai-public-output-keeper --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NAI_WORKBENCH_ENGINE = Join-Path $pwd 'target-windows/build/debug/nai-workbench-engine.exe'
          $env:NAI_FOUNDATION_ENGINE = Join-Path $pwd 'target-windows/build/debug/nai-foundation-engine.exe'
          $env:NAI_PUBLIC_OUTPUT_KEEPER = Join-Path $pwd 'target-windows/build/debug/nai-public-output-keeper.exe'
          cargo test -p nai-workbench-host --locked --tests -- --test-threads=1
      # The v561 voice binary embeds v561-voice/tauri.conf.json, whose frontendDist
      # points at target-windows/v561-voice-ui. That output is gitignored and is not
      # produced by pnpm --recursive build, so the desktop crate cannot compile until
      # this step generates it from the tracked sources.
      - name: Build V5.6.1 voice desktop frontend
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/build-v561-voice.mjs
      - name: Windows independent desktop build and smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path apps/workbench-desktop/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-workbench-desktop.ps1 -Desktop (Join-Path $pwd 'target-windows/build/debug/nai-workbench-desktop.exe') -Engine (Join-Path $pwd 'target-windows/build/debug/nai-workbench-engine.exe') -Foundation (Join-Path $pwd 'target-windows/build/debug/nai-foundation-engine.exe')
      - name: OpenSpec validation
        run: pnpm spec:validate
      - name: Scan repository and diagnostics
        if: always()
        run: cargo xtask check --secrets

